# ═══════════════════════════════════════════════════════════════
# Docker Compose — таймфрейм.рф
# Запуск: docker compose up -d
# ═══════════════════════════════════════════════════════════════

# ─── Логи контейнеров (пост-инцидент 02.07.2026) ─────────────────
# Разбор I/O-шторма упёрся в то, что docker logs api/orchestrator гибнут при
# rolling-recreate деплоя (json-файл лога удаляется вместе с контейнером,
# ротация max-size этого НЕ лечит). Поэтому:
#
# • api / orchestrator / db → journald-драйвер: лог уходит в системный журнал
#   хоста и переживает recreate. Читать: `journalctl -t frame-api --since ...`
#   (tag = SYSLOG_IDENTIFIER, стабилен при росте имени frame-api-N);
#   `docker logs` продолжает работать — драйвер умеет читать журнал обратно.
#   mode=non-blocking: приложение НИКОГДА не блокируется на записи лога —
#   journald на этом сервере сам жертва I/O-штормов (watchdog-kill 02.07,
#   10.04), при его затыке строки копятся в буфере 4МБ и излишек дропается.
#   Потерять строки лучше, чем стопнуть event loop uvicorn'а.
#
# • redis / nginx / tg-bot / certbot → json-file с ротацией: деплой их не
#   пересоздаёт (история не гибнет), но без ротации файл растёт бесконечно
#   (tg-bot дорос до 17МБ за 2 недели).
x-journald-opts: &journald-opts
  mode: "non-blocking"
  max-buffer-size: "4m"
x-log-json: &log-json
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ═══════════════════════════════════════════════════════════════
  # PostgreSQL
  # ═══════════════════════════════════════════════════════════════
  db:
    image: postgres:17-alpine
    restart: always
    # Тюнинг памяти Postgres (версионируется здесь, чтобы переживать пересоздание
    # тома — раньше лежал только в postgresql.auto.conf через ALTER SYSTEM).
    # Дефолты (shared_buffers=128MB/work_mem=4MB) не использовали имеющуюся RAM:
    # тяжёлые сортировки лились на диск, горячие страницы перечитывались. Замер до/
    # после: тёплый sort-запрос 737мс→246мс (~3×), дисковые чтения 34497→0.
    # Значения под 8ГБ-VM (апгрейд 2026-07-12: 4GB/2CPU→8GB/4CPU/77GB).
    # shared_buffers=2GB (~25% RAM) + effective_cache_size=6GB (~75%). Безопасно
    # по OOM: даже на пике деплоя (api build frontend tsc+vite ≈2GB НА проде,
    # своп=0) 2GB pg + 2GB build + ~1.5GB прочее ≈ 5.5GB из 8 → ~2.5GB запас.
    # История: на 4ГБ держали 512MB именно из-за OOM-риска при build (OOM при
    # ≥512MB+build) — удвоение RAM этот риск снял. work_mem-выигрыш на сортировках
    # от shared_buffers не зависит (отдельный буфер на сортировку).
    # pg_stat_statements + track_io_timing (пост-инцидент 02.07.2026, I/O-шторм):
    # без per-query статистики разбор «кто пёк диск» упирается в отсутствие
    # истории. track_io_timing даёт blk_read/write_time в разрезе запросов.
    # Накладные: ~10МБ shared memory (5k statements) + дешёвый clock_gettime.
    # ⚠️ Вступает в силу только при recreate db-контейнера (деплой db НЕ трогает,
    # см. scripts/prod_deploy.sh) — пересоздавать вручную в согласованный момент:
    #   cd /opt/frame && docker compose up -d --no-deps --force-recreate db
    # CREATE EXTENSION уже выполнен заранее (безвреден до загрузки библиотеки).
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=2GB"
      - "-c"
      - "work_mem=32MB"
      - "-c"
      - "effective_cache_size=6GB"
      - "-c"
      - "maintenance_work_mem=256MB"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "track_io_timing=on"
    environment:
      POSTGRES_DB: ${DB_NAME:-moex_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-moex_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    shm_size: 256mb
    # journald: checkpoint/error-логи postgres переживают recreate — при разборе
    # I/O-инцидентов это ровно та история, которой не хватало 02.07.
    logging:
      driver: journald
      options:
        <<: *journald-opts
        tag: "frame-db"

  # ═══════════════════════════════════════════════════════════════
  # Redis (общий кеш между воркерами)
  # ═══════════════════════════════════════════════════════════════
  redis:
    image: redis:7-alpine
    restart: always
    # requirepass: defense-in-depth — Redis не торчит наружу (только docker-сеть),
    # но без пароля любой контейнер в сети имел бы полный доступ к кэшу/стейту.
    # Пароль из .env (REDIS_PASSWORD), не хардкод. Healthcheck аутентифицируется.
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--requirepass", "${REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    logging: *log-json

  # ═══════════════════════════════════════════════════════════════
  # FastAPI + Frontend (SPA)
  # ═══════════════════════════════════════════════════════════════
  api:
    build: .
    restart: always
    # Non-root запуск (security hardening, attempt #2 — chown в Dockerfile
    # gewährt'ит uid=1000 read+write на /app, что в первой попытке (commit
    # 231411a) сломало старт). orchestrator и tg-bot остаются root —
    # ради backward-compat batch-процессов без HTTP exposure.
    user: "1000:1000"
    # ─── Container security hardening (defense in depth) ──────────────
    # Linux capabilities hardening:
    # - cap_drop ALL: убираем все capabilities (NET_ADMIN, SYS_ADMIN, SYS_PTRACE...)
    # - cap_add: оставляем только минимум для Python+nginx-style операций.
    #   CHOWN/SETUID/SETGID — для useradd/login операций (запас на будущее),
    #   DAC_OVERRIDE — для read/write файлов с разными owner'ами,
    #   NET_BIND_SERVICE — для bind порта 8000 (>1024 не нужен, но без вреда).
    # - no-new-privileges: процесс не может escalate'нуть через setuid binary.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - NET_BIND_SERVICE
    # Read-only rootfs: атакующий с RCE не может persistent backdoor
    # через подмену файлов. Writeable места — только tmpfs и named volume.
    read_only: true
    tmpfs:
      # /tmp — Python multiprocessing IPC, gunicorn worker tmp, matplotlib cache.
      - /tmp:size=100M,mode=1777
    volumes:
      # /app/logs — runtime logs от api/logger.py. Named volume чтобы пережить
      # docker compose down (если хочется debug-archive логов через docker cp).
      - api_logs:/app/logs
      # Manual SCHA PDF — пользователь складывает PDF
      - ./data/manual_scha:/data/manual_scha:ro
    # TODO security hardening: запуск под non-root + read_only rootfs.
    # Первая попытка (commit 231411a) сломала prod — api/logger.py создаёт
    # /app/logs при импорте, COPY → root owner → uid=1000 PermissionError.
    # Правильный путь: `RUN chown -R appuser:appuser /app` в Dockerfile
    # после всех COPY-инструкций. Делать отдельной задачей с тестированием.
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DB_URL=postgresql+pg8000://${DB_USER:-postgres}:${DB_PASSWORD}@db:5432/${DB_NAME:-moex_db}
      - DB_URL_ASYNC=postgresql://postgres:${DB_PASSWORD}@db:5432/${DB_NAME:-moex_db}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      # Grace-period для ротации JWT секрета. Пустая строка = ротация не идёт.
      # Procedure rotation:
      #   1. Сгенерировать новый: openssl rand -hex 32
      #   2. JWT_SECRET_KEY_OLD=<текущий>, JWT_SECRET_KEY=<новый> в .env
      #   3. docker compose up -d --force-recreate api
      #   4. Подождать 7 дней (max refresh-token lifetime)
      #   5. Убрать JWT_SECRET_KEY_OLD, recreate.
      - JWT_SECRET_KEY_OLD=${JWT_SECRET_KEY_OLD:-}
      - ALGOPACK_API_KEY=${ALGOPACK_API_KEY}
      - ENV=production
      - ALLOWED_ORIGINS=https://таймфрейм.рф,https://xn--80aklbnczmv.xn--p1ai
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=https://xn--80aklbnczmv.xn--p1ai/auth/callback/google
      - VK_CLIENT_ID=${VK_CLIENT_ID:-}
      - VK_CLIENT_SECRET=${VK_CLIENT_SECRET:-}
      - VK_REDIRECT_URI=https://xn--80aklbnczmv.xn--p1ai/auth/callback/vk
      - YANDEX_CLIENT_ID=${YANDEX_CLIENT_ID:-}
      - YANDEX_CLIENT_SECRET=${YANDEX_CLIENT_SECRET:-}
      - YANDEX_REDIRECT_URI=https://xn--80aklbnczmv.xn--p1ai/auth/callback/yandex
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      # Cbonds (ПИФ-данные: СЧА/пай/состав через fetch_funds_realtime.py).
      # Без этих vars демон шлёт пустые креды → Cbonds «limited rights» → данные встают.
      - CBONDS_LOGIN=${CBONDS_LOGIN:-}
      - CBONDS_PASSWORD=${CBONDS_PASSWORD:-}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      # Billing: T-Bank (единственный провайдер с 2026-05-13).
      # YooKassa удалена — см. .env.example для T-Bank credentials.
      - TBANK_TERMINAL_KEY=${TBANK_TERMINAL_KEY:-}
      - TBANK_PASSWORD=${TBANK_PASSWORD:-}
      # Receipt (54-ФЗ) — фискализация через T-Bank → ОФД.
      # TBANK_RECEIPT_ENABLED=1 включает добавление Receipt блока в /v2/Init.
      # TBANK_TAXATION: osn / usn_income / usn_income_outcome / envd / esn / patent
      # TBANK_VAT: none (УСН) / vat0 / vat10 / vat20 / vat110 / vat120 (ОСН)
      # Требуется хотя бы email или phone у user'а (см. _build_receipt в tbank.py).
      - TBANK_RECEIPT_ENABLED=${TBANK_RECEIPT_ENABLED:-}
      - TBANK_TAXATION=${TBANK_TAXATION:-usn_income}
      - TBANK_VAT=${TBANK_VAT:-none}
      # Почта (SMTP Yandex 360) — письма-подтверждения email при регистрации.
      # ВАЖНО: SMTP_USER/SMTP_FROM в PUNYCODE (noreply@xn--80aklbnczmv.xn--p1ai),
      # не в кириллице — SMTP AUTH/From это ASCII-протокол.
      - SMTP_HOST=${SMTP_HOST:-smtp.yandex.ru}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-Фрейм}
      # KILL-SWITCH публичного API + CSV-экспорта (скрыто до офиц. запуска).
      # Пусто/не задано = выключено (роутеры /api/export,/api/keys,/api/v1/public
      # не монтируются → 404; csv_export/api_access=False даже для Pro).
      # Включить на запуске: PUBLIC_API_CSV_ENABLED=1 в .env + фронт API_CSV_ENABLED=true.
      - PUBLIC_API_CSV_ENABLED=${PUBLIC_API_CSV_ENABLED:-}
      # Content-пайплайн («завод постов»): shared secret для server-to-server
      # callback от Шага А/В (см. api/routers/content_news.py internal_router).
      # Пусто = /api/internal/content-news/* всегда 403 (безопасный дефолт).
      - CONTENT_AI_INTERNAL_TOKEN=${CONTENT_AI_INTERNAL_TOKEN:-}
      # Уведомление коллеги о кандидатах, прошедших хайп+ИИ-фильтр (@hypeframebot,
      # api/routers/content_news.py:_notify_hype_colleague).
      - HYPE_NOTIFY_BOT_TOKEN=${HYPE_NOTIFY_BOT_TOKEN:-}
      - HYPE_NOTIFY_CHAT_ID=${HYPE_NOTIFY_CHAT_ID:-}
      # Cloudflare-релей для обхода РКН — api.telegram.org недоступен напрямую
      # с прод-сервера (см. signals/publish/telegram.py). Без этой переменной
      # _notify_hype_colleague падает с ConnectionError "Network is unreachable"
      # (живой инцидент 2026-07-15).
      - TELEGRAM_API_ROOT=${TELEGRAM_API_ROOT:-}
      # Бесплатный пробный период (free trial). TRIAL_ENABLED=1 включает /trial/*
      # и trial_eligible в /status. TRIAL_HASH_SALT — соль для хешей идентичности
      # анти-абуза (152-ФЗ); НЕ менять после запуска (инвалидирует дедуп-хеши).
      - TRIAL_ENABLED=${TRIAL_ENABLED:-0}
      - TRIAL_HASH_SALT=${TRIAL_HASH_SALT:-}
      # Способ привязки карты для триала: init (1₽+возврат, рабочий по умолчанию)
      # или addcard (0₽, без чеков). addcard включать ТОЛЬКО после настройки
      # Success/Fail Add Card URL на терминале поддержкой T-Bank.
      - TRIAL_BIND_METHOD=${TRIAL_BIND_METHOD:-init}
      # Founder offer — персональный подарочный период для whitelisted user_id
      # (напр. первый подписчик, у кого подписка истекла до настройки автопродления).
      # Пусто = выключено (поведение прода без изменений). "21" или "21,42".
      # FOUNDER_OFFER_DAYS — длительность (по умолч. 30), FOUNDER_OFFER_TIER — pro.
      - FOUNDER_OFFER_USER_IDS=${FOUNDER_OFFER_USER_IDS:-}
      - FOUNDER_OFFER_DAYS=${FOUNDER_OFFER_DAYS:-30}
      # Прод-тест рекуррента: переопределить цену basic малой суммой (напр. 30).
      # Пусто = штатные 2900₽. Должна совпадать в api И orchestrator (конверсию
      # считает оркестратор). Откат — убрать из .env + recreate (без деплоя).
      - BASIC_MONTHLY_OVERRIDE=${BASIC_MONTHLY_OVERRIDE:-}
      # Python не пишет .pyc файлы в /app/api/__pycache__ при импорте
      # модулей. Совместимо с read_only rootfs. Лёгкая просадка на cold
      # import — pyc-кэш отсутствует. Compensated кэш гранулы Python 3.11.
      - PYTHONDONTWRITEBYTECODE=1
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    # journald: история api переживает rolling-recreate (имя контейнера растёт
    # frame-api-N, но tag стабилен → journalctl -t frame-api за все поколения).
    logging:
      driver: journald
      options:
        <<: *journald-opts
        tag: "frame-api"

  # ═══════════════════════════════════════════════════════════════
  # Оркестратор (сбор данных)
  # ═══════════════════════════════════════════════════════════════
  orchestrator:
    build: .
    restart: always
    # Container hardening (defense-in-depth): non-root (uid 1000, как api) +
    # cap_drop:ALL + no-new-privileges. ВАЖНО: user:1000 ОБЯЗАТЕЛЕН — Dockerfile
    # делает chown -R appuser /app, поэтому без него root-процесс при cap_drop:ALL
    # терял CAP_DAC_OVERRIDE и падал на записи /app/logs (PermissionError, поймано
    # на деплое 2026-06-15). Под uid 1000 пишет логи как владелец. (CIS 5.3/5.25)
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_URL=postgresql+pg8000://${DB_USER:-postgres}:${DB_PASSWORD}@db:5432/${DB_NAME:-moex_db}
      - DB_URL_ASYNC=postgresql://postgres:${DB_PASSWORD}@db:5432/${DB_NAME:-moex_db}
      - ALGOPACK_API_KEY=${ALGOPACK_API_KEY}
      # Cbonds — оркестратор запускает fetch_funds_realtime.py --once дважды в день.
      - CBONDS_LOGIN=${CBONDS_LOGIN:-}
      - CBONDS_PASSWORD=${CBONDS_PASSWORD:-}
      # Yahoo через Cloudflare Worker-релей (РКН блокирует прямой Yahoo). Пусто =
      # прямой Yahoo (дефолт в fetch_commodity_realtime.py). См. signals/relay/.
      - COMMODITY_API_ROOT=${COMMODITY_API_ROOT:-}
      # Billing: orchestrator крутит renew_expiring_subs (авто-продление + конверсия
      # триала) → charge_recurrent → нужен РЕАЛЬНЫЙ T-Bank провайдер (без этих var
      # factory отдаёт Stub и списания ФЕЙКОВЫЕ). + Receipt-конфиг для чека 54-ФЗ.
      - TBANK_TERMINAL_KEY=${TBANK_TERMINAL_KEY:-}
      - TBANK_PASSWORD=${TBANK_PASSWORD:-}
      - TBANK_RECEIPT_ENABLED=${TBANK_RECEIPT_ENABLED:-}
      - TBANK_TAXATION=${TBANK_TAXATION:-usn_income}
      - TBANK_VAT=${TBANK_VAT:-none}
      # SMTP: orchestrator шлёт T-1 письмо об окончании триала (send_trial_reminders).
      - SMTP_HOST=${SMTP_HOST:-smtp.yandex.ru}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-Фрейм}
      # Прод-тест рекуррента: цена basic для конверсии триала (должна совпадать с api).
      - BASIC_MONTHLY_OVERRIDE=${BASIC_MONTHLY_OVERRIDE:-}
    command: ["python", "main_orchestrator.py"]
    healthcheck:
      test: ["CMD-SHELL", "test -f /proc/1/cmdline"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: journald
      options:
        <<: *journald-opts
        tag: "frame-orchestrator"

  # ═══════════════════════════════════════════════════════════════
  # Telegram Admin Bot
  # ═══════════════════════════════════════════════════════════════
  tg-bot:
    build: .
    restart: always
    # Container hardening: root batch-процесс, обрабатывает внешний ввод из
    # Telegram. Снимаем capabilities + запрещаем privilege-escalation.
    # (CIS Docker 5.3/5.25, CWE-250)
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      db:
        condition: service_healthy
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - ADMIN_CHAT_ID=${ADMIN_CHAT_ID}
      - DB_URL_SYNC=postgresql://${DB_USER:-postgres}:${DB_PASSWORD}@db:5432/${DB_NAME:-moex_db}
    command: ["python", "tg_bot.py"]
    healthcheck:
      test: ["CMD-SHELL", "test -f /proc/1/cmdline"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *log-json

  # ═══════════════════════════════════════════════════════════════
  # Nginx (reverse proxy + SSL)
  # ═══════════════════════════════════════════════════════════════
  nginx:
    image: nginx:alpine
    restart: always
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # Логи на host для fail2ban-чтения. По умолчанию nginx:alpine
      # симлинкает access.log → /dev/stdout, error.log → /dev/stderr —
      # bind-mount поверх /var/log/nginx убирает симлинки, nginx пишет
      # в файлы. fail2ban читает error.log для rate-limit ban'ов.
      - ./nginx/logs:/var/log/nginx
      - certbot_data:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    # stdout у nginx почти пуст (access/error идут в bind-mount файлы для
    # fail2ban) — ротация просто страхует от бесконечного роста.
    logging: *log-json

  # ═══════════════════════════════════════════════════════════════
  # Certbot (SSL сертификаты Let's Encrypt)
  # ═══════════════════════════════════════════════════════════════
  certbot:
    # Пин по digest (иммутабельно): тег + multi-arch manifest sha256. Защищает
    # даже от перезаписи самого тега v5.6.0 на Docker Hub (poisoned-push → silent pull).
    image: certbot/certbot:v5.6.0@sha256:0107d084c225631fc64a8313e19adb07275f7296fde338f7dfa93986c80b2e3e
    volumes:
      - certbot_data:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'"
    logging: *log-json

volumes:
  postgres_data:
  certbot_data:
  certbot_certs:
  # /app/logs внутри read_only rootfs api-контейнера. Named volume
  # переживает container recreate — можно `docker cp` из инспекции инцидента.
  api_logs:
