# ═══════════════════════════════════════════════════════════════
# Docker Compose — таймфрейм.рф
# Запуск: docker compose up -d
# ═══════════════════════════════════════════════════════════════

services:
  # ═══════════════════════════════════════════════════════════════
  # PostgreSQL
  # ═══════════════════════════════════════════════════════════════
  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-moex_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-moex_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    shm_size: 256mb

  # ═══════════════════════════════════════════════════════════════
  # Redis (общий кеш между воркерами)
  # ═══════════════════════════════════════════════════════════════
  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ═══════════════════════════════════════════════════════════════
  # FastAPI + Frontend (SPA)
  # ═══════════════════════════════════════════════════════════════
  api:
    build: .
    restart: always
    # Non-root запуск (security hardening, attempt #2 — chown в Dockerfile
    # gewährt'ит uid=1000 read+write на /app, что в первой попытке (commit
    # 231411a) сломало старт). orchestrator и tg-bot остаются root —
    # ради backward-compat batch-процессов без HTTP exposure.
    user: "1000:1000"
    # ─── Container security hardening (defense in depth) ──────────────
    # Linux capabilities hardening:
    # - cap_drop ALL: убираем все capabilities (NET_ADMIN, SYS_ADMIN, SYS_PTRACE...)
    # - cap_add: оставляем только минимум для Python+nginx-style операций.
    #   CHOWN/SETUID/SETGID — для useradd/login операций (запас на будущее),
    #   DAC_OVERRIDE — для read/write файлов с разными owner'ами,
    #   NET_BIND_SERVICE — для bind порта 8000 (>1024 не нужен, но без вреда).
    # - no-new-privileges: процесс не может escalate'нуть через setuid binary.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - NET_BIND_SERVICE
    # Read-only rootfs: атакующий с RCE не может persistent backdoor
    # через подмену файлов. Writeable места — только tmpfs и named volume.
    read_only: true
    tmpfs:
      # /tmp — Python multiprocessing IPC, gunicorn worker tmp, matplotlib cache.
      - /tmp:size=100M,mode=1777
    volumes:
      # /app/logs — runtime logs от api/logger.py. Named volume чтобы пережить
      # docker compose down (если хочется debug-archive логов через docker cp).
      - api_logs:/app/logs
    # TODO security hardening: запуск под non-root + read_only rootfs.
    # Первая попытка (commit 231411a) сломала prod — api/logger.py создаёт
    # /app/logs при импорте, COPY → root owner → uid=1000 PermissionError.
    # Правильный путь: `RUN chown -R appuser:appuser /app` в Dockerfile
    # после всех COPY-инструкций. Делать отдельной задачей с тестированием.
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DB_URL=postgresql+pg8000://${DB_USER:-postgres}:${DB_PASSWORD}@db:5432/${DB_NAME:-moex_db}
      - DB_URL_ASYNC=postgresql://postgres:${DB_PASSWORD}@db:5432/${DB_NAME:-moex_db}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      # Grace-period для ротации JWT секрета. Пустая строка = ротация не идёт.
      # Procedure rotation:
      #   1. Сгенерировать новый: openssl rand -hex 32
      #   2. JWT_SECRET_KEY_OLD=<текущий>, JWT_SECRET_KEY=<новый> в .env
      #   3. docker compose up -d --force-recreate api
      #   4. Подождать 7 дней (max refresh-token lifetime)
      #   5. Убрать JWT_SECRET_KEY_OLD, recreate.
      - JWT_SECRET_KEY_OLD=${JWT_SECRET_KEY_OLD:-}
      - ALGOPACK_API_KEY=${ALGOPACK_API_KEY}
      - ENV=production
      - ALLOWED_ORIGINS=https://таймфрейм.рф,https://xn--80aklbnczmv.xn--p1ai
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=https://xn--80aklbnczmv.xn--p1ai/auth/callback/google
      - VK_CLIENT_ID=${VK_CLIENT_ID:-}
      - VK_CLIENT_SECRET=${VK_CLIENT_SECRET:-}
      - VK_REDIRECT_URI=https://xn--80aklbnczmv.xn--p1ai/auth/callback/vk
      - YANDEX_CLIENT_ID=${YANDEX_CLIENT_ID:-}
      - YANDEX_CLIENT_SECRET=${YANDEX_CLIENT_SECRET:-}
      - YANDEX_REDIRECT_URI=https://xn--80aklbnczmv.xn--p1ai/auth/callback/yandex
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - REDIS_URL=redis://redis:6379/0
      # Billing: T-Bank (единственный провайдер с 2026-05-13).
      # YooKassa удалена — см. .env.example для T-Bank credentials.
      - TBANK_TERMINAL_KEY=${TBANK_TERMINAL_KEY:-}
      - TBANK_PASSWORD=${TBANK_PASSWORD:-}
      # Receipt (54-ФЗ) — фискализация через T-Bank → ОФД.
      # TBANK_RECEIPT_ENABLED=1 включает добавление Receipt блока в /v2/Init.
      # TBANK_TAXATION: osn / usn_income / usn_income_outcome / envd / esn / patent
      # TBANK_VAT: none (УСН) / vat0 / vat10 / vat20 / vat110 / vat120 (ОСН)
      # Требуется хотя бы email или phone у user'а (см. _build_receipt в tbank.py).
      - TBANK_RECEIPT_ENABLED=${TBANK_RECEIPT_ENABLED:-}
      - TBANK_TAXATION=${TBANK_TAXATION:-usn_income}
      - TBANK_VAT=${TBANK_VAT:-none}
      # Почта (SMTP Yandex 360) — письма-подтверждения email при регистрации.
      # ВАЖНО: SMTP_USER/SMTP_FROM в PUNYCODE (noreply@xn--80aklbnczmv.xn--p1ai),
      # не в кириллице — SMTP AUTH/From это ASCII-протокол.
      - SMTP_HOST=${SMTP_HOST:-smtp.yandex.ru}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-Фрейм}
      # Python не пишет .pyc файлы в /app/api/__pycache__ при импорте
      # модулей. Совместимо с read_only rootfs. Лёгкая просадка на cold
      # import — pyc-кэш отсутствует. Compensated кэш гранулы Python 3.11.
      - PYTHONDONTWRITEBYTECODE=1
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ═══════════════════════════════════════════════════════════════
  # Оркестратор (сбор данных)
  # ═══════════════════════════════════════════════════════════════
  orchestrator:
    build: .
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_URL=postgresql+pg8000://${DB_USER:-postgres}:${DB_PASSWORD}@db:5432/${DB_NAME:-moex_db}
      - DB_URL_ASYNC=postgresql://postgres:${DB_PASSWORD}@db:5432/${DB_NAME:-moex_db}
      - ALGOPACK_API_KEY=${ALGOPACK_API_KEY}
    command: ["python", "main_orchestrator.py"]
    healthcheck:
      test: ["CMD-SHELL", "test -f /proc/1/cmdline"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ═══════════════════════════════════════════════════════════════
  # Telegram Admin Bot
  # ═══════════════════════════════════════════════════════════════
  tg-bot:
    build: .
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - ADMIN_CHAT_ID=${ADMIN_CHAT_ID}
      - DB_URL_SYNC=postgresql://${DB_USER:-postgres}:${DB_PASSWORD}@db:5432/${DB_NAME:-moex_db}
    command: ["python", "tg_bot.py"]
    healthcheck:
      test: ["CMD-SHELL", "test -f /proc/1/cmdline"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ═══════════════════════════════════════════════════════════════
  # Nginx (reverse proxy + SSL)
  # ═══════════════════════════════════════════════════════════════
  nginx:
    image: nginx:alpine
    restart: always
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # Логи на host для fail2ban-чтения. По умолчанию nginx:alpine
      # симлинкает access.log → /dev/stdout, error.log → /dev/stderr —
      # bind-mount поверх /var/log/nginx убирает симлинки, nginx пишет
      # в файлы. fail2ban читает error.log для rate-limit ban'ов.
      - ./nginx/logs:/var/log/nginx
      - certbot_data:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro

  # ═══════════════════════════════════════════════════════════════
  # Certbot (SSL сертификаты Let's Encrypt)
  # ═══════════════════════════════════════════════════════════════
  certbot:
    image: certbot/certbot
    volumes:
      - certbot_data:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'"

volumes:
  postgres_data:
  certbot_data:
  certbot_certs:
  # /app/logs внутри read_only rootfs api-контейнера. Named volume
  # переживает container recreate — можно `docker cp` из инспекции инцидента.
  api_logs:
