name: gitleaks

# Сканирование секретов: ловит случайно закоммиченные ключи/токены/пароли
# ДО того, как они уйдут в историю (как было с .env.production). Прогоняется
# на каждый push/PR. Для приватных org-репозиториев gitleaks-action требует
# GITLEAKS_LICENSE — тогда раскомментировать env ниже и добавить в Secrets.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      # Пины по commit-SHA — иммутабельны (supply-chain hardening).
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0   # полная история — сканируем все коммиты PR/push
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}  # нужен для приватных org-репо
