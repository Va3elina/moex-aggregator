name: deploy-prod

# Авто-деплой на прод: после успешного build-check (push в main) →
# SSH → git fetch + git reset --hard origin/main (НЕ pull!) + build api
# (+orchestrator/alert-bot при изменении их кода) + recreate + health-check.
# nginx НЕ трогаем (resolver-фикс c40017f сам ре-резолвит api).
#
# Предусловия (выполнены 2026-06-08):
#   • Секрет PROD_SSH_KEY (приватный ключ) добавлен в Settings → Secrets → Actions.
#   • /opt/frame = ЧИСТЫЙ deploy-target: reset --hard форсит origin/main даже если
#     кто-то случайно правил/scp'ил файл на проде (git pull в этом случае падал бы).
#
# Деплой идёт ТОЛЬКО на зелёный build-check (битый фронт-билд не выкатывается).
# workflow_dispatch оставлен для ручного запуска.
#
# Заметка про 4ГБ прод: сборка образа идёт НА проде (с кешем — быстро). Если станет
# тяжело — перенести build в Actions + push в GHCR, прод только pull.

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["build-check"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-prod
  cancel-in-progress: false

# Деплой работает через SSH — токен репозитория ему не нужен для записи.
permissions:
  contents: read

jobs:
  deploy:
    # Только если build-check прошёл (или ручной запуск).
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy
        # Пин по commit-SHA (не плавающий тег): если тег перепереставят на
        # вредоносный коммит, он получил бы PROD_SSH_KEY (root на проде).
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: 103.88.243.232
          username: root
          key: ${{ secrets.PROD_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e
            cd /opt/frame
            before=$(git rev-parse HEAD)
            # reset --hard, НЕ pull: деплой-таргет = ЧИСТЫЙ checkout origin/main.
            # Если кто-то случайно scp'ил/правил файл на проде, git pull падал бы
            # ("local changes would be overwritten ... Aborting"). reset --hard
            # форсит чистое состояние (легитимные правки давно закоммичены).
            git fetch origin main
            git reset --hard origin/main
            after=$(git rev-parse HEAD)
            changed=$(git diff --name-only "$before" "$after")
            echo "=== Changed files ==="; echo "$changed"

            # Убрать висячие renamed-контейнеры от прерванного предыдущего recreate
            # (иначе "container name ..._frame-api-1 already in use" → деплой падал).
            docker rm -f $(docker ps -aq --filter 'name=_frame-api-1') 2>/dev/null || true

            # api всегда (запекает frontend dist + Python код api)
            docker compose build api
            docker compose up -d --force-recreate api

            # orchestrator — ОТДЕЛЬНЫЙ image; пересобираем только если менялся его код
            if echo "$changed" | grep -qE '^(OI/|Funds/|Candles/|Macro/|Commodity/|main_orchestrator\.py|requirements\.txt|Dockerfile$)'; then
              echo "=== Orchestrator code changed -> rebuild ==="
              docker rm -f $(docker ps -aq --filter 'name=_frame-orchestrator-1') 2>/dev/null || true
              docker compose build orchestrator
              docker compose up -d --force-recreate orchestrator
            fi

            # alert-bot — host-side systemd; рестарт только если менялся его код
            if echo "$changed" | grep -qE '^signals/alert_bot\.py$'; then
              echo "=== alert_bot changed -> systemctl restart ==="
              systemctl restart frame-alert-bot
            fi

            echo "=== HEAD на проде: $(git rev-parse --short HEAD) ==="

      - name: Health + SW check
        run: |
          sleep 12   # даём resolver-фиксу nginx ре-резолвить новый IP api
          code=$(curl -s -o /dev/null -w "%{http_code}" https://xn--80aklbnczmv.xn--p1ai/api/health)
          echo "health: HTTP $code"
          test "$code" = "200" || { echo "health failed"; exit 1; }
          curl -s https://xn--80aklbnczmv.xn--p1ai/sw.js | grep -m1 frame- || true
