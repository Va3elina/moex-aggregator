name: deploy-prod

# Авто-деплой на прод: после успешного build-check (push в main) →
# SSH → git fetch + git reset --hard origin/main (НЕ pull!) + build api
# (+orchestrator/alert-bot при изменении их кода) + recreate + health-check.
# nginx НЕ трогаем (resolver-фикс c40017f сам ре-резолвит api).
#
# Предусловия (выполнены 2026-06-08):
#   • Секрет PROD_SSH_KEY (приватный ключ) добавлен в Settings → Secrets → Actions.
#   • /opt/frame = ЧИСТЫЙ deploy-target: reset --hard форсит origin/main даже если
#     кто-то случайно правил/scp'ил файл на проде (git pull в этом случае падал бы).
#
# Деплой идёт ТОЛЬКО на зелёный build-check (битый фронт-билд не выкатывается).
# workflow_dispatch оставлен для ручного запуска.
#
# Заметка про 4ГБ прод: сборка образа идёт НА проде (с кешем — быстро). Если станет
# тяжело — перенести build в Actions + push в GHCR, прод только pull.

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["build-check"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-prod
  cancel-in-progress: false

# Деплой работает через SSH — токен репозитория ему не нужен для записи.
permissions:
  contents: read

jobs:
  deploy:
    # Только если build-check прошёл (или ручной запуск).
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      # Репо нужен для scripts/prod_deploy.sh — пайпим его на сервер по SSH.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # SSH-деплой с РЕТРАЯМИ: сеть GitHub-раннер → РФ-хост периодически флапает
      # (dial tcp ...:22: i/o timeout). Без ретраев каждый такой деплой падал и
      # слал "failed"-уведомление, хотя код корректный. 6 попыток (≈до 5 мин)
      # ловят транзиентные окна потери пакетов. scripts/prod_deploy.sh идемпотентен
      # (reset --hard + rebuild), повтор безопасен. Скрипт из checkout (актуальный
      # origin/main), не с сервера — без version-lag.
      - name: SSH deploy (retry on flaky network)
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$PROD_SSH_KEY" > ~/.ssh/prod_key
          chmod 600 ~/.ssh/prod_key
          ok=0
          for i in 1 2 3 4 5 6; do
            echo "=== SSH deploy: попытка $i/6 ==="
            if ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 \
                   -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
                   -i ~/.ssh/prod_key root@103.88.243.232 'bash -s' < scripts/prod_deploy.sh; then
              ok=1; break
            fi
            echo "попытка $i не удалась (вероятно SSH-таймаут до РФ-хоста), повтор через 20с..."
            sleep 20
          done
          rm -f ~/.ssh/prod_key
          test "$ok" = "1" || { echo "::error::все 6 SSH-попыток провалились — сеть до прод-хоста недоступна"; exit 1; }

      - name: Health + SW check
        run: |
          sleep 12   # даём resolver-фиксу nginx ре-резолвить новый IP api
          code=$(curl -s -o /dev/null -w "%{http_code}" https://xn--80aklbnczmv.xn--p1ai/api/health)
          echo "health: HTTP $code"
          test "$code" = "200" || { echo "health failed"; exit 1; }
          curl -s https://xn--80aklbnczmv.xn--p1ai/sw.js | grep -m1 frame- || true
