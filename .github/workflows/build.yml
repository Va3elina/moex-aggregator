name: build-check

# Гейт сборки: на каждый push в main и каждый PR прогоняем ПОЛНУЮ прод-сборку
# (`npm run build` = tsc -b строгий + vite + prerender). Ловит TS6133 unused и
# type-ошибки, которых `tsc --noEmit` НЕ видит (из-за них 2 июня прод-деплой молча
# падал и оставался на старом образе). Красный билд тут = не мёржим/не деплоим.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Минимальные права GITHUB_TOKEN (по умолчанию репо может выдавать write).
permissions:
  contents: read

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        working-directory: frontend
        run: npm ci

      # prebuild (package.json) запускает python3 scripts/build-sprite.py,
      # который импортит PIL (собирает sprite.png из лого). На раннере (node-only)
      # Pillow нет → ставим. В Docker это делает apk add py3-pillow.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install Pillow (для prebuild build-sprite.py)
        run: pip install pillow

      - name: Build (tsc -b + vite + prerender)
        working-directory: frontend
        run: npm run build

      - name: SW bump check (warning)
        if: github.event_name == 'push'
        run: |
          changed=$(git diff --name-only HEAD~1 HEAD)
          if echo "$changed" | grep -q '^frontend/src/' && ! echo "$changed" | grep -q '^frontend/public/sw.js$'; then
            echo "::warning::frontend/src changed but sw.js not bumped - PWA cache will not refresh. Bump CACHE_NAME."
          fi
