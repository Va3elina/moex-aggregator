name: build-check

# Гейт сборки: на каждый PR в main прогоняем ПОЛНУЮ прод-сборку
# (`npm run build` = tsc -b строгий + vite + prerender). Ловит TS6133 unused и
# type-ошибки, которых `tsc --noEmit` НЕ видит (из-за них 2 июня прод-деплой молча
# падал и оставался на старом образе). Красный билд тут = не мёржим.
#
# Push-триггер на main убран (2026-07-02): branch protection пускает в main
# только PR с зелёным этим же чеком → повторный прогон на main дублировал
# работу и лишь задерживал deploy-prod (он теперь триггерится прямо на push).

on:
  pull_request:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Минимальные права GITHUB_TOKEN (по умолчанию репо может выдавать write).
permissions:
  contents: read

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        working-directory: frontend
        run: npm ci

      # prebuild (package.json) запускает python3 scripts/build-sprite.py,
      # который импортит PIL (собирает sprite.png из лого). На раннере (node-only)
      # Pillow нет → ставим. В Docker это делает apk add py3-pillow.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install Pillow (для prebuild build-sprite.py)
        run: pip install pillow

      - name: Build (tsc -b + vite + prerender)
        working-directory: frontend
        run: npm run build
      # SW bump check удалён (2026-07-02): CACHE_NAME давно бампается АВТОМАТИЧЕСКИ
      # на postbuild (prerender-meta подставляет content-hash) — варнинг был мёртвый.
