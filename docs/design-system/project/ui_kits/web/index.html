<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Фрейм — UI kit</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg-primary);color:var(--fg-primary);font-family:var(--font-sans);min-height:100vh}
  *{box-sizing:border-box}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:999px}
  ::-webkit-scrollbar-thumb:hover{background:var(--fg-muted)}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="data.js"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="OverviewPage.jsx"></script>
<script type="text/babel" src="FearIndexPage.jsx"></script>
<script type="text/babel" src="HeatmapPage.jsx"></script>
<script type="text/babel" src="StrengthPage.jsx"></script>

<script type="text/babel">
const { useState, useEffect } = React;

function App() {
  const [route, setRoute] = useState(() => localStorage.getItem('frame_route') || 'overview');
  useEffect(() => { localStorage.setItem('frame_route', route); }, [route]);

  let page;
  if (route === 'overview')  page = <OverviewPage setRoute={setRoute} />;
  else if (route === 'fear') page = <FearIndexPage />;
  else if (route === 'heatmap') page = <HeatmapPage />;
  else if (route === 'strength') page = <StrengthPage />;
  else page = (
    <PageShell>
      <PageHero icon={route === 'buffett' ? 'buffett' : route === 'oi' ? 'oi' : 'funds'}
        title={{ buffett: 'Индикатор Баффета', oi: 'Открытый интерес', funds: 'Фонды' }[route]}
        subtitle="Страница индикатора — использует те же компоненты: PageHero, MetricHero, ChartBox, ScaleBar" />
      <div style={{ padding: 48, textAlign: 'center', background: 'var(--bg-widget)', border: '1px solid var(--border)', borderRadius: 16, color: 'var(--fg-secondary)' }}>
        <div style={{ fontSize: 14 }}>Спроектировано по тому же шаблону, что и «Индекс страха» и «Сила рынка»:</div>
        <div style={{ marginTop: 8, fontSize: 13, color: 'var(--fg-muted)' }}>
          PageHero → MetricHero + ChartBox → таблица компонентов или секторов.
        </div>
      </div>
    </PageShell>
  );

  return (
    <>
      <Nav route={route} setRoute={setRoute} />
      <div data-screen-label={`${String([...['overview','fear','heatmap','strength','buffett','oi','funds']].indexOf(route)+1).padStart(2,'0')} ${route}`}>
        {page}
      </div>
      <footer style={{ maxWidth: 1280, margin: '48px auto 24px', padding: '0 24px', textAlign: 'center', color: 'var(--fg-muted)', fontSize: 12 }}>
        Фрейм · Биржа MOEX · Данные с задержкой 15 мин.
      </footer>
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
