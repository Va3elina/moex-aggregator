<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  html,body{margin:0;background:var(--bg-primary);color:var(--fg-primary);font-family:var(--font-sans)}
  .wrap{padding:20px;display:flex;flex-direction:column;gap:12px}
  .row{display:flex;gap:4px}
  .cell{flex:1;height:56px;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:12px;text-shadow:0 1px 3px rgba(0,0,0,.8)}
  .pct{font-size:11px;font-weight:600;opacity:.9}
  .lbl{font-size:11px;color:var(--fg-muted);letter-spacing:.05em;text-transform:uppercase}
</style></head><body><div class="wrap">
  <div class="lbl">Finviz-style — dark center, saturated (not neon) extremes</div>
  <div class="row">
    <div class="cell" style="background:rgb(24,168,24)">SBER<span class="pct">+4,8%</span></div>
    <div class="cell" style="background:rgb(32,132,32)">LKOH<span class="pct">+2,1%</span></div>
    <div class="cell" style="background:rgb(36,85,40)">GAZP<span class="pct">+0,9%</span></div>
    <div class="cell" style="background:#2A2A2A">YNDX<span class="pct">0,0%</span></div>
    <div class="cell" style="background:rgb(107,40,40)">ROSN<span class="pct">−0,8%</span></div>
    <div class="cell" style="background:rgb(184,32,32)">VTBR<span class="pct">−2,5%</span></div>
    <div class="cell" style="background:rgb(220,38,38)">NVTK<span class="pct">−5,2%</span></div>
  </div>
</div></body></html>
