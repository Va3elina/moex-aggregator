<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  html,body{margin:0;background:var(--bg-primary);color:var(--fg-primary);font-family:var(--font-sans)}
  .wrap{padding:20px;display:flex;align-items:center;gap:28px}
  .big{font-size:120px;font-weight:800;line-height:1;letter-spacing:-.03em;color:var(--accent)}
  .meta{display:flex;flex-direction:column;gap:4px}
  .k{font-size:11px;color:var(--fg-muted);text-transform:uppercase;letter-spacing:.05em}
  .v{font-size:13px;color:var(--fg-secondary);font-variant-numeric:tabular-nums}
</style></head><body><div class="wrap">
  <span class="big">1 234,56</span>
  <div class="meta">
    <span class="k">Numerics</span>
    <span class="v">tabular-nums: ON</span>
    <span class="v">feature: 'tnum' 1, 'cv11' 1</span>
    <span class="v">Decimal comma, space thousands</span>
    <span class="v">Deltas use + / − (U+2212)</span>
  </div>
</div></body></html>
