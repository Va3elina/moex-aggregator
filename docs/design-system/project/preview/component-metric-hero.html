<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  html,body{margin:0;background:var(--bg-primary);color:var(--fg-primary);font-family:var(--font-sans)}
  .wrap{padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .card{background:var(--bg-widget);border:1px solid var(--border);border-radius:16px;padding:22px;display:flex;flex-direction:column;align-items:center;text-align:center}
  .num{font-size:72px;font-weight:700;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:8px 0 10px}
  .pill{font-size:12px;font-weight:500;padding:6px 12px;border-radius:999px;border:1px solid}
  .cap{font-size:12px;color:var(--fg-muted);margin-top:8px}
</style></head><body><div class="wrap">
  <div class="card">
    <div class="num" style="color:#F97316">62</div>
    <div class="pill" style="color:#F97316;background:rgba(249,115,22,.13);border-color:rgba(249,115,22,.3)">Страх</div>
    <div class="cap">0 (жадность) → 100 (страх)</div>
  </div>
  <div class="card">
    <div class="num" style="color:#22c55e">94%</div>
    <div class="pill" style="color:#22c55e;background:rgba(34,197,94,.13);border-color:rgba(34,197,94,.3)">Рынок недооценён</div>
    <div class="cap">Капитализация / ВВП</div>
  </div>
</div></body></html>
