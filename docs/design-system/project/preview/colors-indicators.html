<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  html,body{margin:0;background:var(--bg-primary);color:var(--fg-primary);font-family:var(--font-sans)}
  .wrap{padding:20px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .sw{display:flex;flex-direction:column;gap:6px}
  .tile{height:56px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px;letter-spacing:.02em}
  .n{font-size:12px;font-weight:500}
  .h{font-size:11px;color:var(--fg-muted);font-family:var(--font-mono)}
</style></head><body><div class="wrap">
  <div class="sw"><div class="tile" style="background:linear-gradient(135deg,#F97316,#EF4444)">СТРАХ</div><span class="n">fear</span><span class="h">#F97316</span></div>
  <div class="sw"><div class="tile" style="background:linear-gradient(135deg,#22C55E,#14B8A6)">КАРТА</div><span class="n">heatmap</span><span class="h">#22C55E</span></div>
  <div class="sw"><div class="tile" style="background:linear-gradient(135deg,#6366F1,#818CF8);color:#fff">ОИ</div><span class="n">oi</span><span class="h">#6366F1</span></div>
  <div class="sw"><div class="tile" style="background:linear-gradient(135deg,#2EE59D,#14B8A6);color:#0B0D0F">ФОНДЫ</div><span class="n">funds</span><span class="h">#2EE59D</span></div>
  <div class="sw"><div class="tile" style="background:linear-gradient(135deg,#06B6D4,#0891B2)">СОСТАВ</div><span class="n">catalog</span><span class="h">#06B6D4</span></div>
  <div class="sw"><div class="tile" style="background:linear-gradient(135deg,#F59E0B,#D97706)">БАФФЕТТ</div><span class="n">buffett</span><span class="h">#F59E0B</span></div>
  <div class="sw"><div class="tile" style="background:linear-gradient(135deg,#8B5CF6,#6366F1)">СИЛА</div><span class="n">strength</span><span class="h">#8B5CF6</span></div>
  <div class="sw"><div class="tile" style="background:linear-gradient(135deg,#EC4899,#BE185D)">СЕЗОН</div><span class="n">seasonality</span><span class="h">#EC4899</span></div>
</div></body></html>
