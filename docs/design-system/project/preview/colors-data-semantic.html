<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  html,body{margin:0;background:var(--bg-primary);color:var(--fg-primary);font-family:var(--font-sans)}
  .wrap{padding:20px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .sw{display:flex;flex-direction:column;gap:6px}
  .chip{height:64px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
  .n{font-size:12px;font-weight:500}
  .h{font-size:11px;color:var(--fg-muted);font-family:var(--font-mono)}
</style></head><body><div class="wrap">
  <div class="sw"><div class="chip" style="background:rgba(46,229,157,.14);color:#2EE59D">+12,34%</div><span class="n">data-positive</span><span class="h">#2EE59D</span></div>
  <div class="sw"><div class="chip" style="background:rgba(255,77,77,.14);color:#FF4D4D">−4,21%</div><span class="n">data-negative</span><span class="h">#FF4D4D</span></div>
  <div class="sw"><div class="chip" style="background:rgba(156,163,184,.14);color:#9CA3B8">0,00%</div><span class="n">data-neutral</span><span class="h">#9CA3B8</span></div>
</div></body></html>
