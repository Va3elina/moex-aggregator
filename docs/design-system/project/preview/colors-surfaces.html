<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  html,body{margin:0;background:var(--bg-primary);color:var(--fg-primary);font-family:var(--font-sans)}
  .wrap{padding:20px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .sw{display:flex;flex-direction:column;gap:6px}
  .chip{height:56px;border-radius:12px;border:1px solid var(--border)}
  .n{font-size:12px;color:var(--fg-primary);font-weight:500}
  .h{font-size:11px;color:var(--fg-muted);font-family:var(--font-mono)}
</style></head><body><div class="wrap">
  <div class="sw"><div class="chip" style="background:#0B0D0F"></div><span class="n">bg-primary</span><span class="h">#0B0D0F</span></div>
  <div class="sw"><div class="chip" style="background:#131518"></div><span class="n">bg-secondary</span><span class="h">#131518</span></div>
  <div class="sw"><div class="chip" style="background:#1B1E21"></div><span class="n">bg-tertiary</span><span class="h">#1B1E21</span></div>
  <div class="sw"><div class="chip" style="background:#232629"></div><span class="n">bg-elevated</span><span class="h">#232629</span></div>
</div></body></html>
