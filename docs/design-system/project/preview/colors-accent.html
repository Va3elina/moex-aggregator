<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  html,body{margin:0;background:var(--bg-primary);color:var(--fg-primary);font-family:var(--font-sans)}
  .wrap{padding:20px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .sw{display:flex;flex-direction:column;gap:6px}
  .chip{height:56px;border-radius:12px;border:1px solid var(--border)}
  .n{font-size:12px;color:var(--fg-primary);font-weight:500}
  .h{font-size:11px;color:var(--fg-muted);font-family:var(--font-mono)}
  .tag{font-size:10px;color:var(--fg-muted)}
</style></head><body><div class="wrap">
  <div class="sw"><div class="chip" style="background:#00E676"></div><span class="n">accent</span><span class="h">#00E676</span><span class="tag">Brand / CTA / focus</span></div>
  <div class="sw"><div class="chip" style="background:#00C853"></div><span class="n">accent-2</span><span class="h">#00C853</span><span class="tag">Gradient pair</span></div>
  <div class="sw"><div class="chip" style="background:#FF4081"></div><span class="n">accent-pink</span><span class="h">#FF4081</span><span class="tag">Plus upsell</span></div>
  <div class="sw"><div class="chip" style="background:#448AFF"></div><span class="n">info</span><span class="h">#448AFF</span><span class="tag">Neutral emphasis</span></div>
</div></body></html>
