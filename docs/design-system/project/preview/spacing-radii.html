<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  html,body{margin:0;background:var(--bg-primary);color:var(--fg-primary);font-family:var(--font-sans)}
  .wrap{padding:20px;display:flex;gap:16px;align-items:flex-end}
  .sw{display:flex;flex-direction:column;gap:6px;align-items:center}
  .chip{width:72px;height:72px;background:var(--bg-secondary);border:1px solid var(--border)}
  .n{font-size:12px}
  .h{font-size:11px;color:var(--fg-muted);font-family:var(--font-mono)}
</style></head><body><div class="wrap">
  <div class="sw"><div class="chip" style="border-radius:4px"></div><span class="n">xs</span><span class="h">4px</span></div>
  <div class="sw"><div class="chip" style="border-radius:6px"></div><span class="n">sm</span><span class="h">6px</span></div>
  <div class="sw"><div class="chip" style="border-radius:8px"></div><span class="n">md</span><span class="h">8px</span></div>
  <div class="sw"><div class="chip" style="border-radius:12px"></div><span class="n">lg</span><span class="h">12px</span></div>
  <div class="sw"><div class="chip" style="border-radius:16px;border-color:var(--accent);box-shadow:var(--shadow-md)"></div><span class="n" style="color:var(--accent)">xl ★</span><span class="h">16px</span></div>
  <div class="sw"><div class="chip" style="border-radius:24px"></div><span class="n">2xl</span><span class="h">24px</span></div>
  <div class="sw"><div class="chip" style="border-radius:9999px"></div><span class="n">full</span><span class="h">∞</span></div>
</div></body></html>
