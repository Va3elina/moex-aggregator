<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  html,body{margin:0;background:var(--bg-primary);color:var(--fg-primary);font-family:var(--font-sans)}
  .wrap{padding:28px;display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
  .sw{display:flex;flex-direction:column;gap:8px;align-items:center}
  .chip{width:110px;height:64px;background:var(--bg-secondary);border:1px solid var(--border);border-radius:12px}
  .n{font-size:12px}
  .h{font-size:11px;color:var(--fg-muted);font-family:var(--font-mono)}
</style></head><body><div class="wrap">
  <div class="sw"><div class="chip" style="box-shadow:0 2px 8px rgba(0,0,0,.3)"></div><span class="n">sm</span><span class="h">tooltips</span></div>
  <div class="sw"><div class="chip" style="box-shadow:0 4px 24px rgba(0,0,0,.4)"></div><span class="n">md</span><span class="h">widget default ★</span></div>
  <div class="sw"><div class="chip" style="box-shadow:0 8px 32px rgba(0,0,0,.5)"></div><span class="n">lg</span><span class="h">modals</span></div>
  <div class="sw"><div class="chip" style="box-shadow:0 0 24px rgba(0,230,118,.25);border-color:rgba(0,230,118,.3)"></div><span class="n" style="color:var(--accent)">glow</span><span class="h">accent CTA</span></div>
</div></body></html>
