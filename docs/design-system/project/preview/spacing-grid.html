<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  html,body{margin:0;background:var(--bg-primary);color:var(--fg-primary);font-family:var(--font-sans)}
  .wrap{padding:20px;display:flex;flex-direction:column;gap:8px}
  .row{display:flex;align-items:center;gap:12px}
  .tok{font-size:11px;color:var(--fg-muted);font-family:var(--font-mono);width:72px}
  .bar{height:14px;background:var(--accent);border-radius:2px;opacity:.85}
  .lbl{font-size:12px;color:var(--fg-secondary);margin-left:auto}
</style></head><body><div class="wrap">
  <div class="row"><span class="tok">space-1</span><div class="bar" style="width:4px"></div><span class="lbl">4px</span></div>
  <div class="row"><span class="tok">space-2</span><div class="bar" style="width:8px"></div><span class="lbl">8px — chip gaps</span></div>
  <div class="row"><span class="tok">space-3</span><div class="bar" style="width:12px"></div><span class="lbl">12px</span></div>
  <div class="row"><span class="tok">space-4</span><div class="bar" style="width:16px"></div><span class="lbl">16px — mobile page pad</span></div>
  <div class="row"><span class="tok">space-6</span><div class="bar" style="width:24px"></div><span class="lbl">24px — widget padding, grid gap ★</span></div>
  <div class="row"><span class="tok">space-8</span><div class="bar" style="width:32px"></div><span class="lbl">32px</span></div>
  <div class="row"><span class="tok">space-12</span><div class="bar" style="width:48px"></div><span class="lbl">48px — page section</span></div>
</div></body></html>
