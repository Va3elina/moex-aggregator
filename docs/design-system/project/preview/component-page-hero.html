<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>

  .t2{font-size:13px;color:var(--fg-secondary);margin-top:2px}
</style></head><body><div class="wrap">
  <div class="hero">
    <div class="tile" style="background:linear-gradient(135deg,#F97316,#EF4444)">⚙</div>
    <div><div class="t1">Индекс страха</div><div class="t2">Настроения инвесторов по потокам в фонды</div></div>
  </div>
  <div class="hero">
    <div class="tile" style="background:linear-gradient(135deg,#22C55E,#14B8A6)">▦</div>
    <div><div class="t1">Карта рынка</div><div class="t2">Обновлено в 14:32</div></div>
  </div>
  <div class="hero">
    <div class="tile" style="background:linear-gradient(135deg,#8B5CF6,#6366F1)">↗</div>
    <div><div class="t1">Сила рынка</div><div class="t2">% акций выше EMA200</div></div>
  </div>
</div></body></html>
