<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  html,body{margin:0;background:var(--bg-primary);color:var(--fg-primary);font-family:var(--font-sans)}
  .wrap{padding:20px;display:flex;flex-direction:column;gap:10px}
  .row{display:flex;align-items:baseline;gap:14px}
  .label{font-size:11px;color:var(--fg-muted);width:120px;letter-spacing:.04em;text-transform:uppercase}
  .spec{font-size:11px;color:var(--fg-muted);margin-left:auto;font-variant-numeric:tabular-nums}
</style></head><body><div class="wrap">
  <div class="row"><span class="label">Display</span><span style="font-size:48px;font-weight:700;line-height:1;letter-spacing:-.02em">42</span><span class="spec">72 / 700 / −.02em</span></div>
  <div class="row"><span class="label">H1</span><span style="font-size:32px;font-weight:700">Обзор рынка</span><span class="spec">32 / 700</span></div>
  <div class="row"><span class="label">H2</span><span style="font-size:20px;font-weight:600">Индекс страха</span><span class="spec">20 / 600</span></div>
  <div class="row"><span class="label">Body</span><span style="font-size:14px">Настроения инвесторов по потокам в фонды</span><span class="spec">14 / 400</span></div>
  <div class="row"><span class="label">Small</span><span style="font-size:13px;color:var(--fg-secondary)">За месяц · 12 торговых дней</span><span class="spec">13 / 400</span></div>
  <div class="row"><span class="label">Tiny</span><span style="font-size:11px;color:var(--fg-secondary)">UPDATED 14:32 MSK</span><span class="spec">11 / 400</span></div>
</div></body></html>
