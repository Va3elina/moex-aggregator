<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  html,body{margin:0;background:var(--bg-primary);color:var(--fg-primary);font-family:var(--font-sans)}
  .wrap{padding:24px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  button{font-family:inherit;border:0;cursor:pointer;transition:transform .15s, background-color .2s, color .2s, box-shadow .2s}
  button:active{transform:scale(.95)}
  .ctl{padding:8px 16px;font-size:13px;font-weight:500;border-radius:8px;background:transparent;color:var(--fg-secondary)}
  .ctl:hover{color:var(--fg-primary);background:var(--border)}
  .ctl.act{background:var(--accent);color:var(--fg-inverse)}
  .acc{padding:10px 18px;font-size:13px;font-weight:500;border-radius:12px;background:var(--accent);color:var(--fg-inverse)}
  .acc:hover{opacity:.9;box-shadow:var(--shadow-glow)}
  .plus{padding:8px 16px;font-size:13px;font-weight:500;border-radius:12px;background:var(--accent-pink);color:#fff}
  .ghost{padding:8px 14px;font-size:13px;font-weight:500;border-radius:12px;background:transparent;color:var(--fg-secondary);border:1px solid var(--border)}
  .ghost:hover{background:rgba(255,255,255,.05)}
  .group{display:inline-flex;background:var(--bg-primary);border:1px solid var(--border);border-radius:12px;padding:3px;gap:2px}
</style></head><body><div class="wrap">
  <button class="ctl">Control</button>
  <button class="ctl act">Active</button>
  <button class="acc">Основное</button>
  <button class="plus">Plus</button>
  <button class="ghost">Войти</button>
  <div class="group"><button class="ctl">1М</button><button class="ctl act">3М</button><button class="ctl">6М</button><button class="ctl">1Г</button><button class="ctl">Всё</button></div>
</div></body></html>
