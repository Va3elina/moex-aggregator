<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  html,body{margin:0;background:var(--bg-primary);color:var(--fg-primary);font-family:var(--font-sans)}
  .wrap{padding:24px;display:flex;gap:16px;align-items:flex-start}
  .tt{background:rgba(26,31,46,.95);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.10);border-radius:12px;padding:10px 14px;box-shadow:0 8px 32px rgba(0,0,0,.5);font-size:12px;font-variant-numeric:tabular-nums}
  .tt .h{display:flex;gap:8px;align-items:baseline;margin-bottom:4px}
  .tt .sym{font-weight:700;color:#fff}
  .tt .name{color:var(--fg-secondary);font-size:11px}
  .tt .price{margin-left:auto;color:#fff;font-weight:600}
  .tt .deltas{display:flex;gap:12px;font-size:11px}
  .tt .k{color:var(--fg-muted);margin-right:4px}
  .date{font-size:11px;color:var(--fg-secondary);background:rgba(26,31,46,.9);backdrop-filter:blur(4px);padding:2px 8px;border-radius:6px;border:1px solid var(--border);font-variant-numeric:tabular-nums}
</style></head><body><div class="wrap">
  <div class="tt">
    <div class="h"><span class="sym">SBER</span><span class="name">Сбербанк</span><span class="price">312,45 ₽</span></div>
    <div class="deltas">
      <span><span class="k">Д</span><span style="color:#4ade80">+1,24%</span></span>
      <span><span class="k">Н</span><span style="color:#4ade80">+3,80%</span></span>
      <span><span class="k">М</span><span style="color:#f87171">−2,10%</span></span>
      <span><span class="k">Г</span><span style="color:#4ade80">+18,50%</span></span>
    </div>
  </div>
  <div class="date">15 мар 2026</div>
</div></body></html>
