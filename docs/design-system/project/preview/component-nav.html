<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  html,body{margin:0;background:var(--bg-primary);color:var(--fg-primary);font-family:var(--font-sans)}
  .nav{position:relative;backdrop-filter:blur(20px);background:var(--glass-bg);border-bottom:1px solid var(--border);padding:0 20px;height:64px;display:flex;align-items:center;justify-content:space-between}
  .logo{display:flex;align-items:center;gap:8px}
  .logo .n{font-size:18px;font-weight:700;color:var(--accent)}
  .beta{font-size:11px;color:var(--fg-secondary);background:var(--border);padding:2px 8px;border-radius:999px}
  .dot{width:8px;height:8px;border-radius:50%;background:#10b981}
  .links{display:flex;gap:4px}
  .link{padding:8px 14px;border-radius:12px;font-size:13px;font-weight:500;color:var(--fg-secondary);border:1px solid transparent}
  .link.act{color:var(--accent);background:rgba(0,230,118,.1);border-color:rgba(0,230,118,.3)}
  .right{display:flex;gap:10px;align-items:center}
  .theme{display:flex;gap:6px;align-items:center;padding:6px 10px;border-radius:8px;color:var(--fg-secondary);font-size:11px}
</style></head><body>
<div class="nav">
  <div class="logo"><span class="n">Фрейм</span><span class="beta">Beta</span><span class="dot" title="Live"></span></div>
  <div class="links">
    <span class="link">Индекс страха</span>
    <span class="link act">Карта рынка</span>
    <span class="link">Открытый интерес</span>
    <span class="link">Фонды</span>
  </div>
  <div class="right">
    <div class="theme">🌿 OKX Green</div>
    <span class="link">Войти</span>
  </div>
</div>
</body></html>
