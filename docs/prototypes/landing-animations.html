<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Фрейм — 20 вариантов анимаций лендинга</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg-primary: #0B0D0F;
    --bg-secondary: #131519;
    --text-primary: #E8E8EA;
    --text-secondary: #9CA0A5;
    --text-muted: #6B7079;
    --text-dim: #4A4E55;
    --text-inverse: #0B0D0F;
    --accent: #00E676;
    --accent-warm: #F7931A;
    --accent-danger: #EA3943;
    --accent-blue: #4DA3FF;
    --accent-purple: #9D4DFF;
    --border-color: rgba(255, 255, 255, 0.08);
    --radius-md: 8px;
    --radius-sm: 6px;
  }
  html, body { height: 100%; overflow-x: clip; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Trebuchet MS', Roboto, Ubuntu, sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
  }

  /* Навигация */
  .variant-nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    display: flex;
    gap: 6px;
    padding: 10px 14px;
    background: rgba(11, 13, 15, 0.88);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border-bottom: 1px solid var(--border-color);
    z-index: 100;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .variant-nav::-webkit-scrollbar { display: none; }
  .variant-nav button {
    flex-shrink: 0;
    padding: 7px 11px;
    border: 1px solid var(--border-color);
    background: transparent;
    color: var(--text-secondary);
    border-radius: var(--radius-sm);
    font-size: 11.5px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s ease;
    font-family: inherit;
  }
  .variant-nav button:hover {
    border-color: color-mix(in srgb, var(--accent) 40%, transparent);
    color: var(--text-primary);
  }
  .variant-nav button.active {
    background: color-mix(in srgb, var(--accent) 12%, transparent);
    border-color: color-mix(in srgb, var(--accent) 50%, transparent);
    color: var(--accent);
  }

  /* Hero */
  .hero {
    position: relative;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    padding: 70px 16px 32px;
  }
  .bg-canvas {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    display: none;
  }
  .bg-canvas.active { display: block; }
  .bg-canvas svg {
    width: 100%;
    height: 100%;
    display: block;
  }
  .hero-content {
    position: relative;
    z-index: 10;
    text-align: center;
    max-width: 768px;
    margin: 0 auto;
  }
  .hero h1 {
    font-size: clamp(2.4rem, 7vw, 4.5rem);
    font-weight: 800;
    letter-spacing: -0.035em;
    line-height: 0.95;
    margin-bottom: 28px;
    color: var(--text-primary);
    text-shadow: 0 2px 40px rgba(0, 0, 0, 0.5);
  }
  .hero p.lead {
    font-size: clamp(0.95rem, 1.5vw, 1.2rem);
    color: var(--text-secondary);
    line-height: 1.55;
    max-width: 560px;
    margin: 0 auto 36px;
    text-shadow: 0 1px 20px rgba(0, 0, 0, 0.6);
  }
  .cta-group {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
  }
  .btn {
    padding: 12px 24px;
    border-radius: var(--radius-md);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    transition: opacity 0.15s, border-color 0.15s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: inherit;
  }
  .btn-primary {
    background: var(--accent);
    color: var(--text-inverse);
    border: 1px solid transparent;
  }
  .btn-primary:hover { opacity: 0.9; }
  .btn-secondary {
    background: rgba(11, 13, 15, 0.5);
    border: 1px solid var(--border-color);
    color: var(--text-primary);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }
  .btn-secondary:hover { border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
  .scroll-hint {
    margin-top: 56px;
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.15em;
    font-weight: 500;
  }

  /* =========================================================
     УНИВЕРСАЛЬНЫЕ KEYFRAMES (используются в большинстве V)
     ========================================================= */
  @keyframes u-draw {
    0%   { stroke-dashoffset: 200; opacity: 0; }
    5%   { opacity: var(--op, 0.85); }
    55%  { stroke-dashoffset: 0; opacity: var(--op, 0.85); }
    92%  { opacity: var(--op, 0.85); }
    98%  { opacity: 0; }
    100% { stroke-dashoffset: 0; opacity: 0; }
  }
  @keyframes u-fade {
    0%, 100% { opacity: 0; }
    8%  { opacity: var(--op, 1); }
    92% { opacity: var(--op, 1); }
    98% { opacity: 0; }
  }
  @keyframes u-cell {
    0%, 100% { opacity: 0; transform: scale(0.9); }
    6%  { opacity: var(--op, 0.9); transform: scale(1); }
    92% { opacity: var(--op, 0.9); transform: scale(1); }
    98% { opacity: 0; }
  }
  @keyframes u-breathe {
    0%, 100% { opacity: var(--op-min, 0.6); }
    50%      { opacity: var(--op-max, 1); }
  }

  /* V1 — MC line draw (чуть длиннее цикл, параметризуется) */
  @keyframes v1-line {
    0%   { stroke-dashoffset: 300; opacity: 0; }
    4%   { opacity: var(--op, 0.5); }
    45%  { stroke-dashoffset: 0; opacity: var(--op, 0.5); }
    90%  { opacity: var(--op, 0.5); }
    96%  { opacity: 0; }
    100% { stroke-dashoffset: 0; opacity: 0; }
  }

  /* V3 — candle infinite transition */
  .v3-candle { transition: transform 1.5s linear, opacity 0.6s linear; }

  /* V6 — candle fade */
  @keyframes v6-candle-in {
    0%, 100% { opacity: 0; }
    8%  { opacity: 1; }
    92% { opacity: 1; }
  }

  /* Info-footer */
  .variant-info {
    position: fixed;
    bottom: 14px; left: 14px; right: 14px;
    padding: 10px 14px;
    background: rgba(11, 13, 15, 0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    font-size: 12px;
    color: var(--text-secondary);
    line-height: 1.5;
    z-index: 99;
    max-width: 680px;
    margin: 0 auto;
    text-align: center;
  }
  .variant-info b { color: var(--accent); font-weight: 600; }

  @media (max-width: 600px) {
    .variant-info { font-size: 11px; padding: 8px 12px; }
    .scroll-hint { margin-top: 36px; }
  }
</style>
</head>

<script>
/* =========================================================
   Helpers
   ========================================================= */
function insertSvgMarkup(container, svgMarkup) {
  const doc = new DOMParser().parseFromString(svgMarkup, 'image/svg+xml');
  const root = doc.documentElement;
  if (root.nodeName === 'parsererror') { console.error(root); return; }
  container.appendChild(document.importNode(root, true));
}
function setInfoMarkup(el, htmlMarkup) {
  while (el.firstChild) el.removeChild(el.firstChild);
  const doc = new DOMParser().parseFromString('<div>' + htmlMarkup + '</div>', 'text/html');
  const src = doc.body.firstElementChild;
  if (!src) return;
  while (src.firstChild) el.appendChild(src.firstChild);
}

function seededRandom(seed) {
  let s = (seed * 2654435761) % 2147483647;
  if (s <= 0) s += 2147483647;
  return () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
}
function normalRandom(rand) {
  const u1 = Math.max(rand(), 0.0001);
  const u2 = rand();
  return Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2);
}

const SVG_OPEN = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 60" preserveAspectRatio="xMidYMid slice" width="100%" height="100%">';
const SVG_CLOSE = '</svg>';

function gridLines(yLevels) {
  return '<g stroke="rgba(255,255,255,0.05)" stroke-width="0.1">' +
    yLevels.map(y => '<line x1="0" y1="' + y + '" x2="100" y2="' + y + '"/>').join('') + '</g>';
}
function priceAxis(yLevels, values, xPos) {
  xPos = xPos != null ? xPos : 99;
  return '<g text-anchor="end" font-family="\'IBM Plex Mono\', monospace" font-size="1.6" fill="#4A4E55">' +
    yLevels.map((y, i) => '<text x="' + xPos + '" y="' + (y + 0.6).toFixed(2) + '">' + values[i] + '</text>').join('') + '</g>';
}
function timeAxis(xLevels, labels) {
  return '<g text-anchor="middle" font-family="\'IBM Plex Mono\', monospace" font-size="1.6" fill="#4A4E55">' +
    xLevels.map((x, i) => '<text x="' + x + '" y="58.5">' + labels[i] + '</text>').join('') + '</g>';
}
// Цвет для % change: -N (красный) до +N (зелёный)
function pctColor(pct, intensity) {
  intensity = intensity || 1;
  const a = Math.min(1, Math.abs(pct) / 3 * intensity);
  if (pct >= 0) return 'rgba(0, 230, 118, ' + a.toFixed(2) + ')';
  return 'rgba(234, 57, 67, ' + a.toFixed(2) + ')';
}
// Цвет для correlation: -1 до +1
function corrColor(c) {
  const a = Math.abs(c);
  if (c >= 0) return 'rgba(0, 230, 118, ' + a.toFixed(2) + ')';
  return 'rgba(234, 57, 67, ' + a.toFixed(2) + ')';
}

/* =========================================================
   V1 — MONTE CARLO (winner = одна из траекторий)
   ========================================================= */
function buildV1() {
  const MC_COLORS = ['#4DA3FF','#9D4DFF','#06B6D4','#A78BFA','#FCD34D','#F7931A','#5FADD9','#8B5CF6','#F59E0B','#14B8A6'];
  const PATH_COUNT = 60;
  const steps = 120;
  const stepX = 100 / steps;

  function path(seedId, isWinner) {
    const rand = seededRandom(seedId + 1);
    const drift = isWinner ? -0.35 : (rand() - 0.5) * 0.25;
    const vol   = isWinner ? 0.18 : 0.7 + rand() * 1.2;
    let y = 42;
    const pts = ['M 0,' + y.toFixed(2)];
    for (let i = 1; i <= steps; i++) {
      y += drift + normalRandom(rand) * vol;
      if (y < -5) y = -5 + (y - (-5)) * 0.3;
      if (y > 70) y = 70 + (y - 70) * 0.3;
      pts.push('L ' + (i * stepX).toFixed(2) + ',' + y.toFixed(2));
    }
    return pts.join(' ');
  }

  let parts = [SVG_OPEN];
  parts.push(gridLines([12, 22, 32, 42, 52]));
  for (let i = 1; i < PATH_COUNT; i++) {
    const rand = seededRandom(i * 317 + 11);
    const d = path(i * 7 + 13, false);
    const color = MC_COLORS[i % MC_COLORS.length];
    const width = (0.2 + rand() * 0.3).toFixed(2);
    const op = (0.35 + rand() * 0.3).toFixed(2);
    const delay = (rand() * 2.8).toFixed(2);
    parts.push('<path d="' + d + '" fill="none" stroke="' + color + '" stroke-width="' + width +
      '" stroke-linecap="round" stroke-linejoin="round" style="stroke-dasharray:300;stroke-dashoffset:300;opacity:0;animation:v1-line 12s ease-in-out infinite;animation-delay:' +
      delay + 's;--op:' + op + '"/>');
  }
  const winnerD = path(1, true);
  parts.push('<path d="' + winnerD + '" fill="none" stroke="#00E676" stroke-width="0.75" stroke-linecap="round" stroke-linejoin="round" style="stroke-dasharray:300;stroke-dashoffset:300;opacity:0;animation:v1-line 12s ease-in-out infinite;animation-delay:0.8s;--op:0.95"/>');
  parts.push('<text x="2" y="58" font-family="\'IBM Plex Mono\', monospace" font-size="1.6" fill="#4A4E55" letter-spacing="0.3">MONTE CARLO · N=60 · GBM</text>');
  parts.push(SVG_CLOSE);
  insertSvgMarkup(document.getElementById('canvas-1'), parts.join(''));
}

/* =========================================================
   V2 — BACKTESTING RACE
   ========================================================= */
function buildV2() {
  const Y_TOP = 15, Y_BOT = 48, START_Y = Y_BOT - 3;
  function makeCurve(seedId, driftBias, volMul, steps) {
    steps = steps || 100;
    const rand = seededRandom(seedId);
    const drift = driftBias + (rand() - 0.5) * 0.05;
    const vol = 0.25 * volMul;
    let y = START_Y;
    const pts = ['M 0,' + y.toFixed(2)];
    for (let i = 1; i <= steps; i++) {
      y += -drift + normalRandom(rand) * vol;
      if (y < Y_TOP) y = Y_TOP + Math.abs(normalRandom(rand)) * 0.3;
      if (y > Y_BOT) y = Y_BOT;
      pts.push('L ' + (i * 100 / steps).toFixed(2) + ',' + y.toFixed(2));
    }
    return pts.join(' ');
  }
  const otherColors = ['#4DA3FF','#9D4DFF','#06B6D4','#A78BFA','#F59E0B','#5FADD9','#8B5CF6','#FCD34D','#14B8A6'];
  let parts = [SVG_OPEN];
  parts.push(gridLines([18, 26, 34, 42]));
  parts.push(priceAxis([18, 26, 34, 42], ['+150%','+100%','+50%','0%']));
  parts.push(timeAxis([10, 30, 50, 70, 90], ['2010','2014','2018','2022','2025']));
  for (let i = 0; i < 9; i++) {
    const path = makeCurve(100 + i * 7, 0.18 + (i % 3) * 0.03, 1.0 + (i % 2) * 0.2);
    parts.push('<path d="' + path + '" pathLength="200" fill="none" stroke="' + otherColors[i] +
      '" stroke-width="0.4" stroke-linecap="round" style="stroke-dasharray:200;stroke-dashoffset:200;animation:u-draw 12s ease-out infinite;animation-delay:' +
      (i * 0.03).toFixed(2) + 's;--op:0.4"/>');
  }
  const winner = makeCurve(777, 0.4, 0.5);
  parts.push('<path d="' + winner + '" pathLength="200" fill="none" stroke="#00E676" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round" style="stroke-dasharray:200;stroke-dashoffset:200;animation:u-draw 12s ease-out infinite;--op:0.95"/>');
  parts.push('<text x="2" y="10" font-family="\'IBM Plex Mono\', monospace" font-size="1.6" fill="#4A4E55" letter-spacing="0.3">BACKTEST · 10 СТРАТЕГИЙ · IMOEX</text>');
  parts.push(SVG_CLOSE);
  insertSvgMarkup(document.getElementById('canvas-2'), parts.join(''));
}

/* =========================================================
   V3 — CANDLESTICK FLOW (JS-driven)
   ========================================================= */
const V3_STATE = { candles: [], timerId: null, basePrice: 172.5 };
const V3_VISIBLE = 36;
function v3RandomCandle(prevClose) {
  const drift = (Math.random() - 0.48) * 0.15;
  const vol = 0.3 + Math.random() * 0.25;
  const open = prevClose;
  const close = open + drift + (Math.random() - 0.5) * vol;
  const high = Math.max(open, close) + Math.random() * 0.2;
  const low = Math.min(open, close) - Math.random() * 0.2;
  return { open, close, high, low };
}
function v3Init() {
  V3_STATE.candles = [];
  let price = V3_STATE.basePrice;
  for (let i = 0; i < V3_VISIBLE; i++) {
    const c = v3RandomCandle(price);
    V3_STATE.candles.push(c); price = c.close;
  }
  v3Render();
}
function v3Render() {
  const container = document.getElementById('canvas-3');
  while (container.firstChild) container.removeChild(container.firstChild);
  let maxP = -Infinity, minP = Infinity;
  V3_STATE.candles.forEach(c => { maxP = Math.max(maxP, c.high); minP = Math.min(minP, c.low); });
  const pad = (maxP - minP) * 0.15; maxP += pad; minP -= pad;
  const range = maxP - minP || 1;
  const Y_TOP = 10, Y_BOT = 50;
  const price2y = p => Y_BOT - ((p - minP) / range) * (Y_BOT - Y_TOP);
  const CELL_W = 95 / V3_VISIBLE;
  const BODY_W = CELL_W * 0.65;
  let parts = [SVG_OPEN];
  parts.push(gridLines([15, 25, 35, 45]));
  const yLevels = [15, 25, 35, 45];
  const yValues = yLevels.map(y => (minP + ((Y_BOT - y) / (Y_BOT - Y_TOP)) * range).toFixed(2));
  parts.push(priceAxis(yLevels, yValues));
  V3_STATE.candles.forEach((c, i) => {
    const cx = i * CELL_W + CELL_W / 2;
    const color = c.close >= c.open ? '#00E676' : '#EA3943';
    const bodyTop = price2y(Math.max(c.open, c.close));
    const bodyBot = price2y(Math.min(c.open, c.close));
    const bodyH = Math.max(0.3, bodyBot - bodyTop);
    parts.push('<line class="v3-candle" x1="' + cx.toFixed(2) + '" y1="' + price2y(c.high).toFixed(2) +
      '" x2="' + cx.toFixed(2) + '" y2="' + price2y(c.low).toFixed(2) + '" stroke="' + color + '" stroke-width="0.2"/>');
    parts.push('<rect class="v3-candle" x="' + (cx - BODY_W/2).toFixed(2) + '" y="' + bodyTop.toFixed(2) +
      '" width="' + BODY_W.toFixed(2) + '" height="' + bodyH.toFixed(2) + '" fill="' + color + '"/>');
  });
  const last = V3_STATE.candles[V3_STATE.candles.length - 1];
  const lastColor = last.close >= last.open ? '#00E676' : '#EA3943';
  parts.push('<text x="2" y="8" font-family="\'IBM Plex Mono\', monospace" font-size="2" fill="#9CA0A5" letter-spacing="0.2">SBER ' + last.close.toFixed(2) + '</text>');
  parts.push('<text x="2" y="10.5" font-family="\'IBM Plex Mono\', monospace" font-size="1.6" fill="' + lastColor + '">' +
    (last.close >= last.open ? '▲' : '▼') + ' ' + Math.abs(last.close - last.open).toFixed(2) + '</text>');
  parts.push(SVG_CLOSE);
  insertSvgMarkup(container, parts.join(''));
}
function v3Tick() {
  V3_STATE.candles.shift();
  const last = V3_STATE.candles[V3_STATE.candles.length - 1];
  V3_STATE.candles.push(v3RandomCandle(last.close));
  v3Render();
}
function v3Start() {
  if (V3_STATE.timerId) return;
  if (V3_STATE.candles.length === 0) v3Init();
  V3_STATE.timerId = setInterval(v3Tick, 1500);
}
function v3Stop() {
  if (!V3_STATE.timerId) return;
  clearInterval(V3_STATE.timerId);
  V3_STATE.timerId = null;
}

/* =========================================================
   V4 — MA RIBBON
   ========================================================= */
function buildV4() {
  const N = 200;
  const rand = seededRandom(999);
  const prices = [];
  let p = 30;
  for (let i = 0; i < N; i++) {
    p += normalRandom(rand) * 0.55;
    if (p < 12) p += 0.4;
    if (p > 48) p -= 0.4;
    prices.push(p);
  }
  function sma(arr, window) {
    const out = []; let sum = 0;
    for (let i = 0; i < arr.length; i++) {
      sum += arr[i];
      if (i >= window) sum -= arr[i - window];
      out.push(i >= window - 1 ? sum / window : null);
    }
    return out;
  }
  const MAS = [
    { n: 5,   color: '#FCD34D', width: 0.35, opacity: 0.55 },
    { n: 10,  color: '#F7931A', width: 0.45, opacity: 0.7 },
    { n: 20,  color: '#F59E0B', width: 0.55, opacity: 0.75 },
    { n: 50,  color: '#06B6D4', width: 0.7,  opacity: 0.85 },
    { n: 100, color: '#4DA3FF', width: 0.85, opacity: 0.9 },
    { n: 200, color: '#9D4DFF', width: 1.05, opacity: 0.95 },
  ];
  let minP = Math.min.apply(null, prices), maxP = Math.max.apply(null, prices);
  const pad = (maxP - minP) * 0.1;
  minP -= pad; maxP += pad;
  const range = maxP - minP;
  const y = p => 52 - ((p - minP) / range) * 40;
  function maPath(series) {
    let first = -1; const pts = [];
    series.forEach((v, i) => {
      if (v == null) return;
      if (first < 0) { first = i; pts.push('M ' + (i * 100 / (N-1)).toFixed(2) + ',' + y(v).toFixed(2)); }
      else pts.push('L ' + (i * 100 / (N-1)).toFixed(2) + ',' + y(v).toFixed(2));
    });
    return pts.join(' ');
  }
  const pricePath = prices.map((v, i) =>
    (i === 0 ? 'M ' : 'L ') + (i * 100 / (N-1)).toFixed(2) + ',' + y(v).toFixed(2)
  ).join(' ');
  let parts = [SVG_OPEN];
  parts.push(gridLines([14, 24, 34, 44]));
  const yLevels = [14, 24, 34, 44];
  const yVals = yLevels.map(yy => (minP + ((52 - yy) / 40) * range).toFixed(2));
  parts.push(priceAxis(yLevels, yVals));
  parts.push('<path d="' + pricePath + '" pathLength="200" fill="none" stroke="#6B7079" stroke-width="0.3" stroke-linecap="round" style="stroke-dasharray:200;stroke-dashoffset:200;animation:u-draw 12s ease-out infinite;--op:0.5"/>');
  MAS.slice().reverse().forEach((ma, idx) => {
    const series = sma(prices, ma.n);
    const d = maPath(series);
    const delay = (idx * 0.15).toFixed(2);
    parts.push('<path d="' + d + '" pathLength="200" fill="none" stroke="' + ma.color +
      '" stroke-width="' + ma.width + '" stroke-linecap="round" stroke-linejoin="round" style="stroke-dasharray:200;stroke-dashoffset:200;animation:u-draw 12s ease-out infinite;animation-delay:' +
      delay + 's;--op:' + ma.opacity + '"/>');
  });
  const legend = MAS.slice().reverse().map((ma, i) => {
    const lx = 2, ly = 8 + i * 3;
    return '<line x1="' + lx + '" y1="' + ly + '" x2="' + (lx + 3) + '" y2="' + ly + '" stroke="' + ma.color + '" stroke-width="' + ma.width + '"/>' +
           '<text x="' + (lx + 4) + '" y="' + (ly + 0.6) + '" font-family="\'IBM Plex Mono\', monospace" font-size="1.6" fill="#6B7079">MA ' + ma.n + '</text>';
  }).join('');
  parts.push('<g>' + legend + '</g>');
  parts.push('<text x="98" y="58" text-anchor="end" font-family="\'IBM Plex Mono\', monospace" font-size="1.6" fill="#4A4E55" letter-spacing="0.3">MA РИБОН · 5/10/20/50/100/200</text>');
  parts.push(SVG_CLOSE);
  insertSvgMarkup(document.getElementById('canvas-4'), parts.join(''));
}

/* =========================================================
   V5 — MULTI-CHART 3×3
   ========================================================= */
function buildV5() {
  const TICKERS = [
    { t: 'SBER', seed: 11 }, { t: 'GAZP', seed: 22 }, { t: 'LKOH', seed: 33 },
    { t: 'YNDX', seed: 44 }, { t: 'TCSG', seed: 55 }, { t: 'ROSN', seed: 66 },
    { t: 'TATN', seed: 77 }, { t: 'NVTK', seed: 88 }, { t: 'MGNT', seed: 99 }
  ];
  const COLS = 3, ROWS = 3;
  const CELL_W = 100 / COLS, CELL_H = 60 / ROWS;
  const PAD_X = 1.5, PAD_TOP = 4.5, PAD_BOT = 1.5;
  function miniLine(seed) {
    const rand = seededRandom(seed);
    const steps = 32;
    const drift = (rand() - 0.4) * 0.08;
    const vol = 0.35;
    let y = 0;
    const raw = [y];
    for (let i = 1; i <= steps; i++) { y += drift + normalRandom(rand) * vol; raw.push(y); }
    const mn = Math.min.apply(null, raw), mx = Math.max.apply(null, raw);
    const rng = mx - mn || 1;
    const norm = raw.map(v => (v - mn) / rng);
    return { points: norm, change: raw[raw.length-1] - raw[0] };
  }
  let parts = [SVG_OPEN];
  const divs = [];
  for (let i = 1; i < COLS; i++) divs.push('<line x1="' + (i * CELL_W) + '" y1="0" x2="' + (i * CELL_W) + '" y2="60" stroke="rgba(255,255,255,0.06)" stroke-width="0.15"/>');
  for (let i = 1; i < ROWS; i++) divs.push('<line x1="0" y1="' + (i * CELL_H) + '" x2="100" y2="' + (i * CELL_H) + '" stroke="rgba(255,255,255,0.06)" stroke-width="0.15"/>');
  parts.push('<g>' + divs.join('') + '</g>');
  TICKERS.forEach((tk, idx) => {
    const col = idx % COLS, row = Math.floor(idx / COLS);
    const cx0 = col * CELL_W, cy0 = row * CELL_H;
    const mini = miniLine(tk.seed);
    const isUp = mini.change > 0;
    const color = isUp ? '#00E676' : '#EA3943';
    const chartX0 = cx0 + PAD_X, chartX1 = cx0 + CELL_W - PAD_X;
    const chartY0 = cy0 + PAD_TOP, chartY1 = cy0 + CELL_H - PAD_BOT;
    const chartW = chartX1 - chartX0, chartH = chartY1 - chartY0;
    const d = mini.points.map((v, i) => {
      const px = chartX0 + (i / (mini.points.length - 1)) * chartW;
      const py = chartY1 - v * chartH;
      return (i === 0 ? 'M ' : 'L ') + px.toFixed(2) + ',' + py.toFixed(2);
    }).join(' ');
    const rand2 = seededRandom(tk.seed + 1);
    const price = (20 + rand2() * 500).toFixed(2);
    const changeStr = (isUp ? '+' : '') + (mini.change * 2).toFixed(2) + '%';
    parts.push('<text x="' + (cx0 + 1.5) + '" y="' + (cy0 + 3) + '" font-family="\'IBM Plex Mono\', monospace" font-size="2.2" font-weight="600" fill="#E8E8EA">' + tk.t + '</text>');
    parts.push('<text x="' + (cx0 + CELL_W - 1.5) + '" y="' + (cy0 + 3) + '" text-anchor="end" font-family="\'IBM Plex Mono\', monospace" font-size="1.8" fill="' + color + '">' + changeStr + '</text>');
    parts.push('<text x="' + (cx0 + 1.5) + '" y="' + (cy0 + CELL_H - 0.6) + '" font-family="\'IBM Plex Mono\', monospace" font-size="1.5" fill="#6B7079">' + price + '</text>');
    parts.push('<path d="' + d + '" pathLength="200" fill="none" stroke="' + color + '" stroke-width="0.4" stroke-linecap="round" stroke-linejoin="round" style="stroke-dasharray:200;stroke-dashoffset:200;animation:u-draw 12s ease-out infinite;animation-delay:' +
      (idx * 0.1).toFixed(2) + 's;--op:0.85"/>');
  });
  parts.push(SVG_CLOSE);
  insertSvgMarkup(document.getElementById('canvas-5'), parts.join(''));
}

/* =========================================================
   V6 — PRICE + VOLUME
   ========================================================= */
function buildV6() {
  const COUNT = 50;
  const SPACING = 95 / COUNT;
  const BODY_W = SPACING * 0.65;
  const PRICE_TOP = 8, PRICE_BOT = 40;
  const VOL_TOP = 44, VOL_BOT = 56;
  const rand = seededRandom(2024);
  const candles = [];
  let price = 30;
  for (let i = 0; i < COUNT; i++) {
    const drift = (rand() - 0.48) * 0.3;
    const vol = 0.5 + rand() * 0.5;
    const open = price;
    const close = open + drift + normalRandom(rand) * vol;
    const high = Math.max(open, close) + rand() * 0.6;
    const low = Math.min(open, close) - rand() * 0.6;
    const volume = 0.4 + rand() * 0.6;
    candles.push({ open, close, high, low, volume });
    price = close;
  }
  let minP = Math.min.apply(null, candles.map(c => c.low));
  let maxP = Math.max.apply(null, candles.map(c => c.high));
  const pad = (maxP - minP) * 0.05;
  minP -= pad; maxP += pad;
  const range = maxP - minP;
  const p2y = p => PRICE_BOT - ((p - minP) / range) * (PRICE_BOT - PRICE_TOP);
  const maxVol = Math.max.apply(null, candles.map(c => c.volume));
  let parts = [SVG_OPEN];
  parts.push(gridLines([12, 20, 28, 36]));
  parts.push('<line x1="0" y1="42" x2="100" y2="42" stroke="rgba(255,255,255,0.08)" stroke-width="0.15"/>');
  const yLevels = [12, 20, 28, 36];
  const yVals = yLevels.map(yy => (minP + ((PRICE_BOT - yy) / (PRICE_BOT - PRICE_TOP)) * range).toFixed(2));
  parts.push(priceAxis(yLevels, yVals));
  candles.forEach((c, i) => {
    const x = i * SPACING + SPACING / 2;
    const up = c.close >= c.open;
    const color = up ? '#00E676' : '#EA3943';
    const bodyTop = p2y(Math.max(c.open, c.close));
    const bodyBot = p2y(Math.min(c.open, c.close));
    const bodyH = Math.max(0.3, bodyBot - bodyTop);
    const delay = (i / COUNT * 5).toFixed(2);
    parts.push('<g style="opacity:0;animation:v6-candle-in 12s linear infinite;animation-delay:' + delay + 's">');
    parts.push('<line x1="' + x.toFixed(2) + '" y1="' + p2y(c.high).toFixed(2) + '" x2="' + x.toFixed(2) + '" y2="' + p2y(c.low).toFixed(2) + '" stroke="' + color + '" stroke-width="0.2"/>');
    parts.push('<rect x="' + (x - BODY_W/2).toFixed(2) + '" y="' + bodyTop.toFixed(2) + '" width="' + BODY_W.toFixed(2) + '" height="' + bodyH.toFixed(2) + '" fill="' + color + '"/>');
    const vh = (c.volume / maxVol) * (VOL_BOT - VOL_TOP);
    parts.push('<rect x="' + (x - BODY_W/2).toFixed(2) + '" y="' + (VOL_BOT - vh).toFixed(2) + '" width="' + BODY_W.toFixed(2) + '" height="' + vh.toFixed(2) + '" fill="' + color + '" opacity="0.35"/>');
    parts.push('</g>');
  });
  parts.push('<text x="2" y="5" font-family="\'IBM Plex Mono\', monospace" font-size="1.8" fill="#9CA0A5" letter-spacing="0.2">SBER · 15M · MOEX</text>');
  parts.push('<text x="2" y="45" font-family="\'IBM Plex Mono\', monospace" font-size="1.5" fill="#6B7079">VOLUME</text>');
  parts.push(SVG_CLOSE);
  insertSvgMarkup(document.getElementById('canvas-6'), parts.join(''));
}

  ];
  const Y_TOP = 10, Y_BOT = 50, START_Y = 30, STEPS = 80;
  const lines = SECTORS.map(s => {
    const rand = seededRandom(s.seed * 13);

    const pts = ['M 0,' + y.toFixed(2)];
    for (let i = 1; i <= STEPS; i++) {
      y += -s.drift + normalRandom(rand) * 0.2;
      if (y < Y_TOP) y = Y_TOP + 1;

      pts.push('L ' + (i * 88 / STEPS).toFixed(2) + ',' + y.toFixed(2));
    }
    return { name: s.n, d: pts.join(' '), endY: y };

      '" stroke-width="' + width + '" stroke-linecap="round" stroke-linejoin="round" style="stroke-dasharray:200;stroke-dashoffset:200;animation:u-draw 12s ease-out infinite;animation-delay:' +
      (i * 0.04).toFixed(2) + 's;--op:' + opacity + '"/>');
    const labelColor = i < 3 ? '#00E676' : (i >= sorted.length - 3 ? '#EA3943' : '#9CA0A5');

      '" style="opacity:0;animation:u-fade 12s ease-out infinite;--op:0.95">' + l.name + '</text>');

  parts.push(priceAxis([15, 25, 35, 45], ['+25%','+10%','-5%','-20%'], 87));

    parts.push('</g>');
  });
  parts.push(SVG_CLOSE);
  insertSvgMarkup(document.getElementById('canvas-10'), parts.join(''));
}

  const ROW_H = 3.8;

  ROWS.forEach((row, i) => {
    const ry = Y0 + i * ROW_H;

    const rand = seededRandom(row.seed * 17);

      pts.push(y);

    const mn = Math.min.apply(null, pts), mx = Math.max.apply(null, pts);
    const rng = mx - mn || 1;

    const d = pts.map((v, k) => {

      const py = sparkY1 - ((v - mn) / rng) * sparkH;

}

/* =========================================================
   V12 — YIELD CURVE morph (SMIL)
   ========================================================= */
function buildV12() {
  // 8 точек: 1M, 3M, 6M, 1Y, 3Y, 5Y, 10Y, 20Y
  // Y: 0 = top (high rate), 60 = bottom (low rate)
  // rate scale 6% → y=46, 18% → y=10
  // Нормальная (upward sloping): низкие slot → высокие rates у длинных
  // Плоская: all ~12%
  // Инвертированная: short rates > long rates
  const xs = [8, 18, 28, 40, 55, 68, 82, 96];
  function curveFromRates(rates) {
    // rate 6% → y=46, rate 18% → y=10 → linear map
    return xs.map((x, i) => {
      const y = 46 - (rates[i] - 6) / 12 * 36;
      return (i === 0 ? 'M ' : 'L ') + x + ',' + y.toFixed(2);
    }).join(' ');
  }
  const normal   = curveFromRates([ 8.0,  9.5, 10.8, 12.2, 13.5, 14.2, 14.8, 15.2]);
  const flat     = curveFromRates([12.0, 12.1, 12.0, 11.9, 12.0, 12.1, 11.9, 12.0]);
  const inverted = curveFromRates([15.5, 14.8, 14.2, 13.5, 12.8, 12.0, 10.5,  9.2]);
  const steep    = curveFromRates([ 6.5,  7.8,  9.2, 11.0, 13.8, 15.2, 16.5, 17.8]);
  const values = [normal, flat, flat, inverted, inverted, steep, steep, normal].join(';');
  const keyTimes = '0;0.14;0.28;0.42;0.56;0.7;0.85;1';

  let parts = [SVG_OPEN];
  parts.push(gridLines([14, 22, 30, 38, 46]));
  parts.push(priceAxis([14, 22, 30, 38, 46], ['16%','14%','12%','10%','8%']));
  // X-axis labels (сроки)
  parts.push('<g text-anchor="middle" font-family="\'IBM Plex Mono\', monospace" font-size="1.5" fill="#6B7079">');
  const labels = ['1M','3M','6M','1Y','3Y','5Y','10Y','20Y'];
  xs.forEach((x, i) => parts.push('<text x="' + x + '" y="52">' + labels[i] + '</text>'));
  parts.push('</g>');
  // Morphing curve
  parts.push('<path d="' + normal + '" fill="none" stroke="#00E676" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">');
  parts.push('<animate attributeName="d" dur="12s" repeatCount="indefinite" values="' + values + '" keyTimes="' + keyTimes + '"/>');
  parts.push('</path>');
  // Points
  xs.forEach(x => {
    parts.push('<circle cx="' + x + '" cy="30" r="0.5" fill="#00E676"/>');

  parts.push(SVG_CLOSE);
  insertSvgMarkup(document.getElementById('canvas-12'), parts.join(''));
}

/* =========================================================
   V13 — ICHIMOKU CLOUD
   ========================================================= */
function buildV13() {
  const N = 120;
  const rand = seededRandom(1313);
  const prices = [];
  let p = 30;
  for (let i = 0; i < N; i++) {
    p += normalRandom(rand) * 0.5;
    if (p < 12) p += 0.4;
    if (p > 48) p -= 0.4;
    prices.push(p);
  }
  function hlAvg(arr, window) {
    const out = [];
    for (let i = 0; i < arr.length; i++) {
      if (i < window - 1) { out.push(null); continue; }
      let mn = Infinity, mx = -Infinity;
      for (let j = i - window + 1; j <= i; j++) { mn = Math.min(mn, arr[j]); mx = Math.max(mx, arr[j]); }
      out.push((mn + mx) / 2);
    }
    return out;
  }
  const tenkan = hlAvg(prices, 9);     // красная
  const kijun  = hlAvg(prices, 26);    // синяя
  const spanA = tenkan.map((v, i) => v == null || kijun[i] == null ? null : (v + kijun[i]) / 2);
  const spanB = hlAvg(prices, 52);
  // Shift cloud 26 forward (визуально — clip to display range)
  let minP = Math.min.apply(null, prices), maxP = Math.max.apply(null, prices);
  const pad = (maxP - minP) * 0.1;
  minP -= pad; maxP += pad;
  const range = maxP - minP;
  const y = p => 50 - ((p - minP) / range) * 38;
  function pathFor(series) {
    let first = -1; const pts = [];
    series.forEach((v, i) => {
      if (v == null) return;
      if (first < 0) { first = i; pts.push('M ' + (i * 100 / (N-1)).toFixed(2) + ',' + y(v).toFixed(2)); }
      else pts.push('L ' + (i * 100 / (N-1)).toFixed(2) + ',' + y(v).toFixed(2));
    });
    return pts.join(' ');
  }
  // Cloud (area между spanA и spanB): build closed path
  let cloudFirst = -1;
  const upperPts = [], lowerPts = [];
  for (let i = 0; i < N; i++) {
    if (spanA[i] == null || spanB[i] == null) continue;
    if (cloudFirst < 0) cloudFirst = i;
    upperPts.push([i * 100 / (N-1), y(Math.max(spanA[i], spanB[i]))]);
    lowerPts.push([i * 100 / (N-1), y(Math.min(spanA[i], spanB[i]))]);
  }
  // Средняя tendency: spanA > spanB → bullish (зелёное), иначе bearish
  // Для простоты — одна область зелёного цвета (bullish тренд)
  const cloudD = 'M ' + upperPts.map(p => p[0].toFixed(2) + ',' + p[1].toFixed(2)).join(' L ') +
    ' L ' + lowerPts.slice().reverse().map(p => p[0].toFixed(2) + ',' + p[1].toFixed(2)).join(' L ') + ' Z';

  let parts = [SVG_OPEN];
  parts.push(gridLines([15, 25, 35, 45]));
  // Cloud
  parts.push('<path d="' + cloudD + '" fill="rgba(0, 230, 118, 0.12)" stroke="none" style="opacity:0;animation:u-fade 12s ease-out infinite;animation-delay:1s;--op:0.9"/>');
  // Price
  parts.push('<path d="' + pathFor(prices) + '" pathLength="200" fill="none" stroke="#E8E8EA" stroke-width="0.6" stroke-linecap="round" style="stroke-dasharray:200;stroke-dashoffset:200;animation:u-draw 12s ease-out infinite;--op:0.9"/>');
  // Tenkan (красная)
  parts.push('<path d="' + pathFor(tenkan) + '" pathLength="200" fill="none" stroke="#EA3943" stroke-width="0.4" stroke-linecap="round" style="stroke-dasharray:200;stroke-dashoffset:200;animation:u-draw 12s ease-out infinite;animation-delay:0.3s;--op:0.75"/>');
  // Kijun (синяя)
  parts.push('<path d="' + pathFor(kijun) + '" pathLength="200" fill="none" stroke="#4DA3FF" stroke-width="0.4" stroke-linecap="round" style="stroke-dasharray:200;stroke-dashoffset:200;animation:u-draw 12s ease-out infinite;animation-delay:0.5s;--op:0.75"/>');
  // Span lines (полупрозрачные по границам облака)
  parts.push('<path d="' + pathFor(spanA) + '" pathLength="200" fill="none" stroke="#00E676" stroke-width="0.25" stroke-linecap="round" opacity="0.5"/>');
  parts.push('<path d="' + pathFor(spanB) + '" pathLength="200" fill="none" stroke="#F7931A" stroke-width="0.25" stroke-linecap="round" opacity="0.5"/>');

  // Легенда
  parts.push('<g font-family="\'IBM Plex Mono\', monospace" font-size="1.5" fill="#9CA0A5">');
  parts.push('<rect x="2" y="6" width="3" height="0.5" fill="#EA3943"/><text x="6" y="6.6">Tenkan (9)</text>');
  parts.push('<rect x="2" y="9" width="3" height="0.5" fill="#4DA3FF"/><text x="6" y="9.6">Kijun (26)</text>');
  parts.push('<rect x="2" y="12" width="3" height="1.5" fill="rgba(0,230,118,0.3)"/><text x="6" y="13.2">Kumo облако</text>');
  parts.push('</g>');
  parts.push('<text x="98" y="58" text-anchor="end" font-family="\'IBM Plex Mono\', monospace" font-size="1.5" fill="#4A4E55">ICHIMOKU KINKO HYO</text>');
  parts.push(SVG_CLOSE);
  insertSvgMarkup(document.getElementById('canvas-13'), parts.join(''));
}

/* =========================================================
   V15 — P&L WITH DRAWDOWNS
   ========================================================= */
function buildV15() {
  // Equity curve с несколькими drawdown'ами
  const N = 100;
  const rand = seededRandom(1515);
  const prices = [];
  let y = 48; // старт (низ)
  // Целевой путь вверх с просадками
  const scenario = [
    { to: 40, dd: false }, // растём
    { to: 44, dd: true  }, // первая просадка
    { to: 30, dd: false }, // рост
    { to: 38, dd: true  }, // вторая
    { to: 20, dd: false }, // рост
    { to: 26, dd: true  }, // третья
    { to: 10, dd: false }  // финальный рост
  ];
  const segLen = Math.floor(N / scenario.length);
  const drawdowns = []; // массив {startX, endX, peakY, troughY}
  let peakY = y;
  scenario.forEach((seg, si) => {
    const startX = si * segLen;
    const endX = Math.min(N, (si + 1) * segLen);
    const delta = (seg.to - y) / (endX - startX);
    if (seg.dd) {
      const ddPeak = y; // peak (low y = high equity)
      for (let i = startX; i < endX; i++) {
        y += delta + normalRandom(rand) * 0.3;
        prices.push(y);
      }
      drawdowns.push({ startX, endX, peakY: ddPeak, troughY: Math.max(...prices.slice(startX, endX)) });
    } else {
      for (let i = startX; i < endX; i++) {
        y += delta + normalRandom(rand) * 0.3;
        prices.push(y);
      }
    }
  });
  const x2 = i => (i / (N - 1)) * 95;
  const pathD = prices.map((v, i) => (i === 0 ? 'M ' : 'L ') + x2(i).toFixed(2) + ',' + v.toFixed(2)).join(' ');
  let parts = [SVG_OPEN];
  parts.push(gridLines([12, 20, 28, 36, 44]));
  parts.push(priceAxis([12, 20, 28, 36, 44], ['+100%','+75%','+50%','+25%','0%'], 99));
  // Drawdown области (красные прозрачные)
  drawdowns.forEach((dd, i) => {
    const x1 = x2(dd.startX);
    const x3 = x2(dd.endX - 1);
    parts.push('<rect x="' + x1.toFixed(2) + '" y="' + (dd.peakY - 0.5).toFixed(2) +
      '" width="' + (x3 - x1).toFixed(2) + '" height="' + (dd.troughY - dd.peakY + 1).toFixed(2) +
      '" fill="rgba(234, 57, 67, 0.18)" stroke="none" style="opacity:0;animation:u-fade 12s ease-out infinite;animation-delay:' + (1 + i * 0.3) + 's;--op:0.9"/>');
  });
  // Equity curve
  parts.push('<path d="' + pathD + '" pathLength="200" fill="none" stroke="#00E676" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round" style="stroke-dasharray:200;stroke-dashoffset:200;animation:u-draw 12s ease-out infinite;--op:0.95"/>');
  parts.push('<text x="2" y="6" font-family="\'IBM Plex Mono\', monospace" font-size="1.6" fill="#6B7079" letter-spacing="0.3">КРИВАЯ ДОХОДНОСТИ · DD ЗОНЫ · 10Y</text>');
  parts.push(SVG_CLOSE);
  insertSvgMarkup(document.getElementById('canvas-15'), parts.join(''));
}

/* =========================================================
   V16 — REGIME BANDS (bull/bear/sideways)
   ========================================================= */
function buildV16() {
  const REGIMES = [
    { x0: 0,  x1: 22, type: 'bull',     label: 'БЫКИ' },
    { x0: 22, x1: 38, type: 'bear',     label: 'МЕДВЕДИ' },
    { x0: 38, x1: 58, type: 'sideways', label: 'БОКОВИК' },
    { x0: 58, x1: 78, type: 'bull',     label: 'БЫКИ' },
    { x0: 78, x1: 100,type: 'bear',     label: 'КОРРЕКЦИЯ' }
  ];
  const fillColors = { bull: 'rgba(0, 230, 118, 0.08)', bear: 'rgba(234, 57, 67, 0.08)', sideways: 'rgba(156, 160, 165, 0.06)' };
  const labelColors = { bull: '#00E676', bear: '#EA3943', sideways: '#9CA0A5' };
  // Price line следует regimes
  const rand = seededRandom(1616);
  const pts = [];
  let y = 30;
  for (let i = 0; i <= 100; i++) {
    const regime = REGIMES.find(r => i >= r.x0 && i <= r.x1) || REGIMES[REGIMES.length-1];
    let drift = 0;
    if (regime.type === 'bull') drift = -0.18;
    else if (regime.type === 'bear') drift = 0.22;
    y += drift + normalRandom(rand) * 0.7;
    if (y < 8) y = 8 + Math.abs(normalRandom(rand)) * 0.4;
    if (y > 50) y = 50 - Math.abs(normalRandom(rand)) * 0.4;
    pts.push([i, y]);
  }
  const pathD = pts.map((p, i) => (i === 0 ? 'M ' : 'L ') + p[0] + ',' + p[1].toFixed(2)).join(' ');
  let parts = [SVG_OPEN];
  // Фоновые полосы

  insertSvgMarkup(document.getElementById('canvas-16'), parts.join(''));
}

/* =========================================================
   V17 — CORRELATION MATRIX 10×10
   ========================================================= */
function buildV17() {
  const TICKERS = ['SBER','GAZP','LKOH','YNDX','TCSG','ROSN','TATN','NVTK','MGNT','MOEX'];
  const N = TICKERS.length;
  const rand = seededRandom(1717);
  // Генерим корреляции (симметричная матрица, диагональ = 1)
  const M = [];
  for (let i = 0; i < N; i++) {
    M.push([]);
    for (let j = 0; j < N; j++) {
      if (i === j) M[i].push(1);
      else if (j < i) M[i].push(M[j][i]);
      else M[i].push(-0.2 + rand() * 1.2); // от -0.2 до +1
    }
  }
  const CELL = 4.5;
  const X0 = 14, Y0 = 8;
  let parts = [SVG_OPEN];
  // Заголовки столбцов (сверху)
  TICKERS.forEach((t, i) => {
    parts.push('<text x="' + (X0 + i * CELL + CELL/2) + '" y="' + (Y0 - 1) +
      '" text-anchor="middle" font-family="\'IBM Plex Mono\', monospace" font-size="1.4" fill="#9CA0A5">' + t + '</text>');
  });
  // Заголовки строк (слева)
  TICKERS.forEach((t, i) => {
    parts.push('<text x="' + (X0 - 1) + '" y="' + (Y0 + i * CELL + CELL/2 + 0.5) +
      '" text-anchor="end" font-family="\'IBM Plex Mono\', monospace" font-size="1.4" fill="#9CA0A5">' + t + '</text>');
  });
  // Ячейки
  for (let i = 0; i < N; i++) {
    for (let j = 0; j < N; j++) {
      const corr = M[i][j];
      const color = corrColor(corr);
      const cx = X0 + j * CELL;
      const cy = Y0 + i * CELL;
      const delay = ((i + j) * 0.04).toFixed(2);
      parts.push('<rect x="' + cx + '" y="' + cy + '" width="' + (CELL - 0.2) + '" height="' + (CELL - 0.2) +
        '" fill="' + color + '" style="transform-origin:' + (cx + CELL/2) + 'px ' + (cy + CELL/2) +
        'px;opacity:0;animation:u-cell 12s ease-out infinite;animation-delay:' + delay + 's;--op:0.95"/>');
      // Значение корреляции (только для видимых значений)
      if (Math.abs(corr) > 0.3) {
        parts.push('<text x="' + (cx + CELL/2) + '" y="' + (cy + CELL/2 + 0.5) +
          '" text-anchor="middle" font-family="\'IBM Plex Mono\', monospace" font-size="1.1" fill="#0B0D0F" font-weight="600" style="opacity:0;animation:u-fade 12s ease-out infinite;animation-delay:' +
          (parseFloat(delay) + 0.3) + 's;--op:0.85">' + corr.toFixed(2) + '</text>');
      }

  parts.push(SVG_CLOSE);
  insertSvgMarkup(document.getElementById('canvas-17'), parts.join(''));
}

/* =========================================================
   V18 — RANDOM WALK + LINEAR REGRESSION
   ========================================================= */
function buildV18() {
  const N = 150;
  const rand = seededRandom(1818);
  const pts = [];
  let y = 45;
  for (let i = 0; i < N; i++) {
    y += -0.18 + normalRandom(rand) * 0.65; // upward bias
    if (y < 8) y = 8 + Math.abs(normalRandom(rand)) * 0.3;
    if (y > 55) y = 55 - Math.abs(normalRandom(rand)) * 0.3;
    pts.push(y);
  }
  // Linear regression
  let sumX = 0, sumY = 0, sumXY = 0, sumX2 = 0;
  for (let i = 0; i < N; i++) { sumX += i; sumY += pts[i]; sumXY += i * pts[i]; sumX2 += i * i; }
  const slope = (N * sumXY - sumX * sumY) / (N * sumX2 - sumX * sumX);
  const intercept = (sumY - slope * sumX) / N;
  const regY = i => intercept + slope * i;
  // 2σ confidence bands
  let sse = 0;
  for (let i = 0; i < N; i++) sse += Math.pow(pts[i] - regY(i), 2);
  const stderr = Math.sqrt(sse / N);
  const x2 = i => (i / (N - 1)) * 95;
  const walkD = pts.map((v, i) => (i === 0 ? 'M ' : 'L ') + x2(i).toFixed(2) + ',' + v.toFixed(2)).join(' ');
  const regD = 'M 0,' + regY(0).toFixed(2) + ' L 95,' + regY(N-1).toFixed(2);
  const upperD = 'M 0,' + (regY(0) - 2*stderr).toFixed(2) + ' L 95,' + (regY(N-1) - 2*stderr).toFixed(2);
  const lowerD = 'M 0,' + (regY(0) + 2*stderr).toFixed(2) + ' L 95,' + (regY(N-1) + 2*stderr).toFixed(2);
  // Confidence area
  const areaD = 'M 0,' + (regY(0) - 2*stderr).toFixed(2) + ' L 95,' + (regY(N-1) - 2*stderr).toFixed(2) +
    ' L 95,' + (regY(N-1) + 2*stderr).toFixed(2) + ' L 0,' + (regY(0) + 2*stderr).toFixed(2) + ' Z';
  let parts = [SVG_OPEN];
  parts.push(gridLines([15, 25, 35, 45]));
  // Confidence area
  parts.push('<path d="' + areaD + '" fill="rgba(247, 147, 26, 0.10)" style="opacity:0;animation:u-fade 12s ease-out infinite;animation-delay:1.5s;--op:1"/>');
  // 2σ bands
  parts.push('<path d="' + upperD + '" fill="none" stroke="#F7931A" stroke-width="0.25" stroke-dasharray="1 1" style="opacity:0;animation:u-fade 12s ease-out infinite;animation-delay:1.2s;--op:0.7"/>');
  parts.push('<path d="' + lowerD + '" fill="none" stroke="#F7931A" stroke-width="0.25" stroke-dasharray="1 1" style="opacity:0;animation:u-fade 12s ease-out infinite;animation-delay:1.2s;--op:0.7"/>');
  // Random walk
  parts.push('<path d="' + walkD + '" pathLength="200" fill="none" stroke="#9CA0A5" stroke-width="0.35" stroke-linecap="round" stroke-linejoin="round" style="stroke-dasharray:200;stroke-dashoffset:200;animation:u-draw 12s ease-out infinite;--op:0.75"/>');
  // Regression
  parts.push('<path d="' + regD + '" pathLength="200" fill="none" stroke="#00E676" stroke-width="0.7" stroke-linecap="round" stroke-dasharray="200" style="stroke-dashoffset:200;animation:u-draw 12s ease-out infinite;animation-delay:0.8s;--op:0.95"/>');
  parts.push('<text x="2" y="6" font-family="\'IBM Plex Mono\', monospace" font-size="1.6" fill="#6B7079" letter-spacing="0.3">ТРЕНД В ШУМЕ · REG + 2σ · IMOEX</text>');
  parts.push('<text x="98" y="6" text-anchor="end" font-family="\'IBM Plex Mono\', monospace" font-size="1.5" fill="#00E676">R² = 0.73</text>');
  parts.push(SVG_CLOSE);
  insertSvgMarkup(document.getElementById('canvas-18'), parts.join(''));
}

/* =========================================================
   V19 — MONTE CARLO FAN CHART
   ========================================================= */
function buildV19() {
  const N_SIMS = 300;
  const STEPS = 60;
  const rand = seededRandom(1919);
  // Генерим 300 GBM путей, берём quantiles по времени
  const paths = [];
  for (let s = 0; s < N_SIMS; s++) {
    const r2 = seededRandom(s * 37 + 1);
    let y = 42;
    const traj = [y];
    const drift = -0.18;
    const vol = 0.55;
    for (let t = 1; t <= STEPS; t++) {
      y += drift + normalRandom(r2) * vol;
      if (y < 2) y = 2;
      if (y > 58) y = 58;
      traj.push(y);
    }
    paths.push(traj);
  }
  // Quantiles по каждому timestep
  function quantile(arr, q) {
    const sorted = arr.slice().sort((a, b) => a - b);
    const idx = (sorted.length - 1) * q;
    const lo = Math.floor(idx), hi = Math.ceil(idx);
    return lo === hi ? sorted[lo] : sorted[lo] * (hi - idx) + sorted[hi] * (idx - lo);
  }
  const Q05 = [], Q25 = [], Q50 = [], Q75 = [], Q95 = [];
  for (let t = 0; t <= STEPS; t++) {
    const col = paths.map(p => p[t]);
    Q05.push(quantile(col, 0.05));
    Q25.push(quantile(col, 0.25));
    Q50.push(quantile(col, 0.50));
    Q75.push(quantile(col, 0.75));
    Q95.push(quantile(col, 0.95));
  }
  const x2 = t => (t / STEPS) * 100;
  function pathFromQuantiles(q) {
    return q.map((v, i) => (i === 0 ? 'M ' : 'L ') + x2(i).toFixed(2) + ',' + v.toFixed(2)).join(' ');
  }
  function areaFrom(upper, lower) {
    return 'M ' + upper.map((v, i) => x2(i).toFixed(2) + ',' + v.toFixed(2)).join(' L ') +
      ' L ' + lower.slice().reverse().map((v, i) => x2(STEPS - i).toFixed(2) + ',' + v.toFixed(2)).join(' L ') + ' Z';
  }
  let parts = [SVG_OPEN];
  parts.push(gridLines([12, 22, 32, 42, 52]));
  // 90% CI (5%-95%)
  parts.push('<path d="' + areaFrom(Q05, Q95) + '" fill="rgba(234, 57, 67, 0.12)" style="opacity:0;animation:u-fade 12s ease-out infinite;animation-delay:1s;--op:1"/>');
  // 50% CI (25%-75%)
  parts.push('<path d="' + areaFrom(Q25, Q75) + '" fill="rgba(247, 147, 26, 0.18)" style="opacity:0;animation:u-fade 12s ease-out infinite;animation-delay:1.3s;--op:1"/>');
  // Медиана
  parts.push('<path d="' + pathFromQuantiles(Q50) + '" pathLength="200" fill="none" stroke="#00E676" stroke-width="0.7" stroke-linecap="round" style="stroke-dasharray:200;stroke-dashoffset:200;animation:u-draw 12s ease-out infinite;--op:0.95"/>');

  // Легенда
  parts.push('<g font-family="\'IBM Plex Mono\', monospace" font-size="1.4" fill="#9CA0A5">');
  parts.push('<rect x="2" y="6"  width="3" height="0.5" fill="#00E676"/><text x="6" y="6.5">Медиана</text>');
  parts.push('<rect x="2" y="9"  width="3" height="1"   fill="rgba(247,147,26,0.4)"/><text x="6" y="10">50% CI</text>');
  parts.push('<rect x="2" y="12" width="3" height="1"   fill="rgba(234,57,67,0.3)"/><text x="6" y="13">90% CI</text>');
  parts.push('</g>');
  parts.push('<text x="98" y="58" text-anchor="end" font-family="\'IBM Plex Mono\', monospace" font-size="1.5" fill="#4A4E55">FAN CHART · 300 SIMS · 60 DAYS</text>');
  parts.push(SVG_CLOSE);
  insertSvgMarkup(document.getElementById('canvas-19'), parts.join(''));
}

/* =========================================================
   V20 — MA RIBBON + BREAKOUT
   ========================================================= */
function buildV20() {
  const N = 200;
  const rand = seededRandom(2020);
  const prices = [];
  let p = 32;
  for (let i = 0; i < N; i++) {
    // Первые 70% — колебание. Последние 30% — крутой рост.
    const frac = i / N;
    const uptrend = frac > 0.7 ? -(frac - 0.7) * 1.8 : 0;
    p += uptrend + normalRandom(rand) * 0.35;
    if (p < 2) p = 2;
    if (p > 58) p = 58;
    prices.push(p);
  }
  function sma(arr, window) {
    const out = []; let sum = 0;
    for (let i = 0; i < arr.length; i++) {
      sum += arr[i];
      if (i >= window) sum -= arr[i - window];
      out.push(i >= window - 1 ? sum / window : null);
    }
    return out;
  }
  const MAS = [
    { n: 5,   color: '#FCD34D', width: 0.35, opacity: 0.55 },
    { n: 10,  color: '#F7931A', width: 0.45, opacity: 0.7 },
    { n: 20,  color: '#F59E0B', width: 0.55, opacity: 0.75 },
    { n: 50,  color: '#06B6D4', width: 0.7,  opacity: 0.85 },
    { n: 100, color: '#4DA3FF', width: 0.85, opacity: 0.9 }
  ];
  let minP = Math.min.apply(null, prices), maxP = Math.max.apply(null, prices);
  const pad = (maxP - minP) * 0.1;
  minP -= pad; maxP += pad;
  const range = maxP - minP;
  const y = p => 52 - ((p - minP) / range) * 40;
  function maPath(series) {
    let first = -1; const pts = [];
    series.forEach((v, i) => {
      if (v == null) return;
      if (first < 0) { first = i; pts.push('M ' + (i * 100 / (N-1)).toFixed(2) + ',' + y(v).toFixed(2)); }
      else pts.push('L ' + (i * 100 / (N-1)).toFixed(2) + ',' + y(v).toFixed(2));
    });
    return pts.join(' ');
  }
  const pricePath = prices.map((v, i) =>
    (i === 0 ? 'M ' : 'L ') + (i * 100 / (N-1)).toFixed(2) + ',' + y(v).toFixed(2)
  ).join(' ');
  let parts = [SVG_OPEN];
  parts.push(gridLines([14, 24, 34, 44]));
  const yLevels = [14, 24, 34, 44];
  const yVals = yLevels.map(yy => (minP + ((52 - yy) / 40) * range).toFixed(2));
  parts.push(priceAxis(yLevels, yVals));
  // MA в порядке от долгих к коротким
  MAS.slice().reverse().forEach((ma, idx) => {
    const series = sma(prices, ma.n);
    const d = maPath(series);
    const delay = (idx * 0.15).toFixed(2);
    parts.push('<path d="' + d + '" pathLength="200" fill="none" stroke="' + ma.color +
      '" stroke-width="' + ma.width + '" stroke-linecap="round" stroke-linejoin="round" style="stroke-dasharray:200;stroke-dashoffset:200;animation:u-draw 12s ease-out infinite;animation-delay:' +
      delay + 's;--op:' + ma.opacity + '"/>');
  });
  // Цена — жирнее, зелёная, выделяется
  parts.push('<path d="' + pricePath + '" pathLength="200" fill="none" stroke="#00E676" stroke-width="0.75" stroke-linecap="round" stroke-linejoin="round" style="stroke-dasharray:200;stroke-dashoffset:200;animation:u-draw 12s ease-out infinite;animation-delay:0.8s;--op:0.95"/>');
  // Маркер breakout — вертикальная пунктирная на 70%
  parts.push('<line x1="70" y1="5" x2="70" y2="55" stroke="rgba(0, 230, 118, 0.4)" stroke-width="0.2" stroke-dasharray="1.5 1" style="opacity:0;animation:u-fade 12s ease-out infinite;animation-delay:1.5s;--op:0.9"/>');
  parts.push('<text x="71" y="10" font-family="\'IBM Plex Mono\', monospace" font-size="1.5" fill="#00E676" style="opacity:0;animation:u-fade 12s ease-out infinite;animation-delay:1.7s;--op:0.9">BREAKOUT</text>');
  parts.push('<text x="2" y="6" font-family="\'IBM Plex Mono\', monospace" font-size="1.6" fill="#6B7079" letter-spacing="0.3">ПРОБОЙ MA ЛЕНТЫ · ТРЕНД ↑</text>');
  parts.push(SVG_CLOSE);
  insertSvgMarkup(document.getElementById('canvas-20'), parts.join(''));
}

function selectVariant(v) {
  const nav = document.getElementById('nav');
  const canvases = document.querySelectorAll('.bg-canvas');
  nav.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.v === v));
  canvases.forEach(c => c.classList.toggle('active', c.dataset.v === v));
  setInfoMarkup(document.getElementById('info'), DESCRIPTIONS[v] || '');
  location.hash = 'v' + v;
  if (v === '3') v3Start(); else v3Stop();
}

document.getElementById('nav').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-v]');
  if (btn) selectVariant(btn.dataset.v);
});

const hashMatch = location.hash.match(/#v(\d+)/);
const initialV = hashMatch ? hashMatch[1] : '1';
selectVariant(initialV);

document.addEventListener('keydown', (e) => {
  const cur = parseInt(document.querySelector('.variant-nav button.active').dataset.v, 10);
  if (e.key === 'ArrowRight' && cur < 20) selectVariant(String(cur + 1));
  if (e.key === 'ArrowLeft'  && cur > 1)  selectVariant(String(cur - 1));
});
