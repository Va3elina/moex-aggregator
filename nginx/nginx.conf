worker_processes auto;
events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Скрыть версию nginx в Server header / страницах ошибок.
    # CVE-recon начинается с fingerprint версии → off защищает от автомат-сканеров.
    server_tokens off;

    # Логи
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Лог технических данных по использованию Биржевой информации объявлен НЕ
    # здесь, а в conf.d/00-bi-logging.conf. Причина в способе монтирования:
    # этот файл проброшен в контейнер как ОДИНОЧНЫЙ файл, а деплой заменяет его
    # через git reset --hard, то есть меняет inode — контейнер продолжает видеть
    # старую версию до пересоздания. conf.d смонтирован директорией и такой
    # проблемы не имеет. Всё, что меняется чаще базовых настроек, держим там.

    # Оптимизация
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    # Лимит запросов (защита от брутфорса)
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=3r/m;
    limit_req_log_level warn;

    # ─── Переезд на framedata.ru ─────────────────────────────────────
    # Прежние адреса (таймфрейм.рф и его punycode-форма) отдают 301 на новый
    # домен. Туда же уходит www — канонический адрес один, без www.
    #
    # Исключения — /api/ и /embed/. По ним ходит уже установленное у людей
    # расширение версии 0.6.2: его host_permissions выданы на старый домен,
    # и редирект оборвал бы запросы. Тем же путём живут чужие встройки,
    # которые кто-то поставил себе на сайт со старым адресом в iframe.
    # Снять исключения можно, когда версия 0.7.0 вытеснит предыдущую.
    #
    # map вместо цепочки if: вычисляется один раз на запрос и не зависит
    # от порядка директив внутри server.
    map $host $frame_host_is_old {
        default              1;
        framedata.ru         0;
    }
    map $uri $frame_uri_exempt {
        default              0;
        ~^/api/              1;
        ~^/embed/            1;
    }
    map "$frame_host_is_old$frame_uri_exempt" $frame_redirect_legacy {
        default              0;
        "10"                 1;
    }

    include /etc/nginx/conf.d/*.conf;
}
