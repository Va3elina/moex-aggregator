worker_processes auto;
events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Скрыть версию nginx в Server header / страницах ошибок.
    # CVE-recon начинается с fingerprint версии → off защищает от автомат-сканеров.
    server_tokens off;

    # Логи
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ─── Технические данные по использованию Биржевой информации ─────
    # Договор ИТО с МосБиржей, п.4.6.1: собирать и хранить не менее ТРЁХ ЛЕТ
    # технические данные, «позволяющие достоверно подтвердить использование
    # Биржевой информации» — маршруты перемещения пользователей, обобщённые
    # данные о времени сессий и объёмах просмотренных данных. Аудит смотрит
    # именно их (п.4.6.2 Условий, п.3.5.4 Порядка проведения аудита).
    #
    # Почему ОТДЕЛЬНЫЙ лог, а не удлинение общего access.log:
    #   • общий живёт 14 дней и содержит сырой IP — он для ops и fail2ban,
    #     держать сырые адреса три года незачем;
    #   • здесь IP обезличен (последний октет обнулён), сохраняются только
    #     маршрут, объём и тайминг — минимум, закрывающий обязательство;
    #   • пишется на уровне nginx, поэтому НЕ зависит от opt-out продуктовой
    #     аналитики: обязанность по договору согласием не гейтится.
    # Ретеншен задаётся logrotate — см. nginx/logrotate/frame-nginx в репозитории.
    map $remote_addr $ip_anon {
        ~^(?<v4>\d+\.\d+\.\d+)\.\d+$          $v4.0;
        ~^(?<v6>[^:]*:[^:]*:[^:]*):           $v6::;
        default                               0.0.0.0;
    }

    # Что считаем обращением за Биржевой информацией: весь /api/ (через него
    # ходят свечи, ОИ, карта рынка, экспорт) и /embed/ (внешние встройки).
    map $uri $bi_usage_request {
        default              0;
        ~^/api/              1;
        ~^/embed/            1;
    }

    log_format bi_usage '$time_iso8601 $ip_anon "$request" $status '
                        'bytes=$body_bytes_sent rt=$request_time '
                        'ref="$http_referer" ua="$http_user_agent"';

    # Оптимизация
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    # Лимит запросов (защита от брутфорса)
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=3r/m;
    limit_req_log_level warn;

    # ─── Переезд на framedata.ru ─────────────────────────────────────
    # Прежние адреса (таймфрейм.рф и его punycode-форма) отдают 301 на новый
    # домен. Туда же уходит www — канонический адрес один, без www.
    #
    # Исключения — /api/ и /embed/. По ним ходит уже установленное у людей
    # расширение версии 0.6.2: его host_permissions выданы на старый домен,
    # и редирект оборвал бы запросы. Тем же путём живут чужие встройки,
    # которые кто-то поставил себе на сайт со старым адресом в iframe.
    # Снять исключения можно, когда версия 0.7.0 вытеснит предыдущую.
    #
    # map вместо цепочки if: вычисляется один раз на запрос и не зависит
    # от порядка директив внутри server.
    map $host $frame_host_is_old {
        default              1;
        framedata.ru         0;
    }
    map $uri $frame_uri_exempt {
        default              0;
        ~^/api/              1;
        ~^/embed/            1;
    }
    map "$frame_host_is_old$frame_uri_exempt" $frame_redirect_legacy {
        default              0;
        "10"                 1;
    }

    include /etc/nginx/conf.d/*.conf;
}
