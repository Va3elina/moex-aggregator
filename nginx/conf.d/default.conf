# ═══════════════════════════════════════════════════════════════
# HTTP → HTTPS редирект + Let's Encrypt challenge
# ═══════════════════════════════════════════════════════════════
server {
    listen 80;
    server_name таймфрейм.рф xn--80aklbnczmv.xn--p1ai;

    # Let's Encrypt verification
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Редирект на HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ═══════════════════════════════════════════════════════════════
# HTTPS — основной сайт
# ═══════════════════════════════════════════════════════════════
server {
    listen 443 ssl;
    http2 on;
    server_name таймфрейм.рф xn--80aklbnczmv.xn--p1ai;

    # SSL сертификаты (Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/xn--80aklbnczmv.xn--p1ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn--80aklbnczmv.xn--p1ai/privkey.pem;

    # SSL настройки
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Не утекать полный URL referrer'а на external links — оставить только origin.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Отключить ненужные браузерные API. interest-cohort=() блокирует FLoC.
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=(), payment=()" always;
    # CSP в Report-Only режиме (наблюдение без блокировки). 10.06.2026 закрыты 3
    # дыры из аудита violation-reports + code-audit внешних origin'ов: wss://
    # mc.yandex.ru (Метрика-websocket, был только .com), avatars.yandex.net
    # (аватары Yandex-юзеров), media-src 'self' blob: (hls.js-видео через MSE).
    # TODO(enforce): после чистого окна наблюдения (несколько дней БЕЗ новых
    # violation в /api/csp-report → moex_api logger) сменить обе строки
    # Content-Security-Policy-Report-Only → Content-Security-Policy. unsafe-inline
    # в script-src оставлен осознанно (inline JSON-LD из prerender + Метрика);
    # убирать — отдельная задача с nonce/hash.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://mc.yandex.ru https://mc.yandex.com https://integrationjs.t-static.ru; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://mc.yandex.ru https://mc.yandex.com https://avatars.yandex.net https://t.me https://*.userapi.com https://lh3.googleusercontent.com; media-src 'self' blob:; connect-src 'self' https://mc.yandex.ru https://mc.yandex.com wss://mc.yandex.com wss://mc.yandex.ru https://*.tbank.ru; font-src 'self' data: https://fonts.gstatic.com; frame-src https://pay.tbank.ru https://oauth.telegram.org; object-src 'none'; base-uri 'self'; form-action 'self' https://pay.tbank.ru https://oauth.telegram.org; report-uri /api/csp-report" always;

    # Docker embedded DNS + переменная upstream: nginx РЕ-РЕЗОЛВИТ api по DNS
    # (valid=10s), а не кеширует IP на время жизни воркера. → при recreate
    # api-контейнера (новый docker-IP) nginx сам подхватывает новый адрес в
    # течение 10с БЕЗ рестарта/reload — устраняет 502-окно деплоя и снимает
    # обязательный `docker restart frame-nginx-1`. ipv6=off: у контейнеров нет
    # IPv6, AAAA-лукапы только тормозили бы (известные грабли IPv6+Docker).
    # ВАЖНО: переменная в proxy_pass требует resolver; URI передаётся как есть
    # (у всех /api,/assets,/embed,/ — нет URI-части в proxy_pass и нет
    # rewrite...break до проксирования, поэтому семантика идентична литералу).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream api;

    # ─── API ───────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://$api_upstream:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Таймауты для тяжёлых запросов
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ─── SSE (Server-Sent Events) ─────────────────────────────
    location /api/events/stream {
        proxy_pass http://$api_upstream:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE-специфичные настройки
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;     # Держать SSE-соединение до 1 часа
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        chunked_transfer_encoding off;
        add_header X-Accel-Buffering no;
    }

    # ─── Блокировка сканеров/ботов ────────────────────────────
    location ~* ^/(wp-admin|wp-login|wp-content|wordpress|phpmyadmin|pma|admin|shell|config|setup) {
        return 444;
    }
    location ~* \.(php|asp|aspx|jsp|cgi|sh|py|pl|rb)$ {
        return 444;
    }
    location ~ /\. {
        return 444;
    }

    # ─── Auth rate limiting ────────────────────────────────────
    location /api/auth/login {
        limit_req zone=auth burst=1 nodelay;
        limit_req_status 429;
        proxy_pass http://$api_upstream:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/auth/register {
        limit_req zone=auth burst=1 nodelay;
        limit_req_status 429;
        proxy_pass http://$api_upstream:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Health check ──────────────────────────────────────────
    location /health {
        proxy_pass http://$api_upstream:8000;
    }

    # ─── Service Worker — никогда не кешировать ────────────────
    location = /sw.js {
        proxy_pass http://$api_upstream:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # ─── Статика с хэшами (Vite assets) — долгий кэш ────────
    location /assets/ {
        proxy_pass http://$api_upstream:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # ─── Embed-виджеты (для расширения в терминале Т-Инвестиций) ──
    # X-Frame-Options DENY (server-level + FastAPI middleware) запрещал бы
    # встраивать /embed/ в чужую страницу. Для /embed/ снимаем XFO
    # (proxy_hide_header убирает upstream-заголовок FastAPI; свой не добавляем)
    # и ограничиваем, КТО может фреймить, через enforce-CSP frame-ancestors —
    # только домены терминала Т-Инвестиций. ^~ matched раньше regex/catch-all.
    location ^~ /embed/ {
        proxy_pass http://$api_upstream:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_hide_header X-Frame-Options;

        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "frame-ancestors 'self' https://*.tbank.ru https://*.tinkoff.ru" always;
    }

    # ─── Frontend SPA (catch-all) ──────────────────────────────
    location / {
        # Trailing-slash redirect: /buffett/ → /buffett (избегаем duplicate URL'ов
        # для индексатора). Не применяется к корню / и к /api/* /assets/* (они
        # матчатся другими location-блоками раньше).
        rewrite ^/(.+)/$ /$1 permanent;

        proxy_pass http://$api_upstream:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # HTML не кешировать — всегда свежий index.html
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        # NGINX pitfall: любой add_header в location переопределяет ВСЕ
        # server-level add_header'ы (наследование исчезает). Поэтому критичные
        # security headers продублированы здесь. Особенно важно для catch-all /
        # — отдаёт SPA HTML, CSP должен прилететь именно сюда.
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=(), payment=()" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://mc.yandex.ru https://mc.yandex.com https://integrationjs.t-static.ru; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://mc.yandex.ru https://mc.yandex.com https://avatars.yandex.net https://t.me https://*.userapi.com https://lh3.googleusercontent.com; media-src 'self' blob:; connect-src 'self' https://mc.yandex.ru https://mc.yandex.com wss://mc.yandex.com wss://mc.yandex.ru https://*.tbank.ru; font-src 'self' data: https://fonts.gstatic.com; frame-src https://pay.tbank.ru https://oauth.telegram.org; object-src 'none'; base-uri 'self'; form-action 'self' https://pay.tbank.ru https://oauth.telegram.org; report-uri /api/csp-report" always;
    }
}
