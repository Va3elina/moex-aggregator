# ═══════════════════════════════════════════════════════════════
# Технические данные по использованию Биржевой информации
# ═══════════════════════════════════════════════════════════════
#
# Договор ИТО с МосБиржей, п.4.6.1: собирать и хранить не менее ТРЁХ ЛЕТ
# технические данные, «позволяющие достоверно подтвердить использование
# Биржевой информации» — маршруты перемещения пользователей, обобщённые данные
# о времени сессий и объёмах просмотренных данных. Информационный аудит
# смотрит именно их (п.4.6.2 Условий, п.3.5.4 Порядка проведения аудита).
#
# Почему ОТДЕЛЬНЫЙ лог, а не удлинение общего access.log:
#   • общий живёт 14 дней и содержит сырой IP — он для ops и fail2ban,
#     держать сырые адреса три года незачем;
#   • здесь IP обезличен (последний октет обнулён), сохраняются только
#     маршрут, объём и тайминг — минимум, закрывающий обязательство;
#   • пишется на уровне nginx, поэтому НЕ зависит от opt-out продуктовой
#     аналитики: обязанность по договору согласием не гейтится.
#
# Почему в conf.d, а не в nginx.conf: nginx.conf проброшен в контейнер как
# одиночный файл, и деплой (git reset --hard) меняет его inode — контейнер
# продолжает видеть старую версию до пересоздания. conf.d смонтирован
# директорией и подхватывает правки обычным reload. Префикс 00- гарантирует,
# что формат объявлен раньше, чем на него сошлётся default.conf.
#
# Ретеншен — logrotate, конфигурация в nginx/logrotate/frame-nginx.

map $remote_addr $ip_anon {
    ~^(?<v4>\d+\.\d+\.\d+)\.\d+$          $v4.0;
    ~^(?<v6>[^:]*:[^:]*:[^:]*):           $v6::;
    default                               0.0.0.0;
}

# Что считаем обращением за Биржевой информацией: весь /api/ (через него
# ходят свечи, ОИ, карта рынка, экспорт) и /embed/ (внешние встройки).
map $uri $bi_usage_request {
    default              0;
    ~^/api/              1;
    ~^/embed/            1;
}

log_format bi_usage '$time_iso8601 $ip_anon "$request" $status '
                    'bytes=$body_bytes_sent rt=$request_time '
                    'ref="$http_referer" ua="$http_user_agent"';
