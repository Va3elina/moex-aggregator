<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FRAME</title>
  <style>
    :root { --bg:#0E0E10; --panel:#17161A; --text:#F5F1E8; --dim:#9A958C; --accent:#FF5C2B; --border:#F5F1E8; --ok:#4A9268; }
    * { box-sizing: border-box; }
    body {
      width: 280px; margin: 0; padding: 16px;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
    }
    .hd { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
    .logo { font-weight: 800; font-size: 16px; letter-spacing: -0.01em; }
    p { margin: 0 0 10px; font-size: 12.5px; line-height: 1.5; color: var(--dim); }
    .lbl { display: block; font-size: 11px; font-weight: 700; color: var(--text); margin: 6px 0 4px; text-transform: uppercase; letter-spacing: 0.04em; }
    .inp {
      width: 100%; padding: 8px 10px; font-family: ui-monospace, Menlo, monospace; font-size: 12px;
      background: var(--panel); color: var(--text); border: 1.5px solid var(--border); border-radius: 6px; outline: none;
    }
    .row { display: flex; gap: 8px; margin-top: 8px; }
    .btn {
      flex: 1; padding: 8px 12px; background: var(--accent); color: #fff; font-weight: 700; font-size: 12.5px;
      border: 1.5px solid var(--border); border-radius: 6px; cursor: pointer;
    }
    .btn-ghost {
      padding: 8px 12px; background: transparent; color: var(--text); font-weight: 600; font-size: 12.5px;
      border: 1.5px solid var(--border); border-radius: 6px; cursor: pointer;
    }
    .status { margin: 8px 0 0; font-size: 12px; min-height: 16px; }
    .link { display: inline-block; margin-top: 12px; font-size: 12px; color: var(--accent); text-decoration: underline; }
    .ver { margin-top: 12px; font-size: 10px; color: var(--dim); opacity: 0.75; }
  </style>
</head>
<body>
  <div class="hd"><span class="dot"></span><span class="logo">FRAME</span></div>
  <p>Индикаторы FRAME плавающим окном поверх терминала Т-Инвестиций.</p>

  <label class="lbl" for="tok">PRO-токен</label>
  <input id="tok" class="inp" type="text" placeholder="ext_…" autocomplete="off" spellcheck="false" />
  <div class="row">
    <button id="save" class="btn">Сохранить</button>
    <button id="clear" class="btn-ghost">Отозвать</button>
  </div>
  <p id="status" class="status"></p>

  <a class="link" href="https://framedata.ru/profile" target="_blank" rel="noopener noreferrer">
    Сгенерировать токен — личный кабинет (Pro)
  </a>

  <p class="ver"><span id="ver"></span> вставьте токен → индикаторы в терминале разблокируются</p>
  <script src="popup.js"></script>
</body>
</html>
